# Veröffentlicht die Website unter https://<owner>.github.io/<repo>/: Landingpage (site/, englisch und unter /de/
# deutsch), die App unter /app/ und die Bilder aus docs/images unter /images/.
# Einmalig nötig: Settings → Pages → Source: „GitHub Actions“.
name: Online-Version

on:
  push:
    branches: [main]
    paths: ["prototyp/dist/**", "docs/images/**", "site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site/app
          cp -r site/. _site/
          cp prototyp/dist/index.html _site/app/index.html
          cp -r docs/images _site/images
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
