name: Idea or wish / Idee oder Wunsch
description: A suggestion how Lichtjahr could get better. / Ein Vorschlag, wie Lichtjahr besser werden kann.
labels: [idee]
body:
  - type: markdown
    attributes:
      value: English or German, whichever you prefer. / Gern auf Englisch oder Deutsch.
  - type: textarea
    id: ziel
    attributes:
      label: What do you want to achieve when making your calendar? / Was möchtest du beim Kalendermachen erreichen?
      description: Describe the situation, not only the solution. / Beschreibe die Situation, nicht nur die Lösung.
    validations:
      required: true
  - type: textarea
    id: vorschlag
    attributes:
      label: What could it look like? / Wie könnte es aussehen?
  - type: textarea
    id: alternativen
    attributes:
      label: How do you do it today? / Wie machst du es bisher?
