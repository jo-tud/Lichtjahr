[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lichtjahr"
version = "1.0.0"
description = "Local service for Lichtjahr, the family photo wall calendar: project folders, photos by month, print PDF with color management"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pillow>=10.2",
  "python-multipart>=0.0.9",
  "pikepdf>=8.0",
  "httpx>=0.27",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",   # Gesichter finden (YuNet); fehlt es, ist nur diese Funktion aus
]

[project.optional-dependencies]
dev = ["pytest>=8", "wsgidav>=4.3", "cheroot>=10", "pillow-heif>=0.16"]
heic = ["pillow-heif>=0.16"]       # HEIC/HEIF vom iPhone (bringt libheif mit, LGPL)

[project.scripts]
lichtjahr = "lichtjahr.cli:main"

[tool.setuptools.packages.find]
include = ["lichtjahr*"]

[tool.setuptools.package-data]
lichtjahr = ["static/*.html", "icc/*.icc", "icc/*.md", "icc/*.txt", "models/*.onnx", "models/*.md", "models/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
