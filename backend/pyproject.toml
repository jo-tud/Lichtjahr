[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lichtjahr"
version = "0.1.0"
description = "Lokaler Dienst für Lichtjahr: Projektordner, Fotos nach Monaten, Sperre, Druck-PDF mit Farbmanagement"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pillow>=10.2",
  "python-multipart>=0.0.9",
  "pikepdf>=8.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "wsgidav>=4.3", "cheroot>=10"]

[project.scripts]
lichtjahr = "lichtjahr.cli:main"

[tool.setuptools.packages.find]
include = ["lichtjahr*"]

[tool.setuptools.package-data]
lichtjahr = ["icc/*.icc", "icc/*.md", "icc/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
