<style>
/* Layout: Werkbank – links die Blätter, in der Mitte der Leuchttisch, rechts das Werkzeug. */
:root {
  --bg: #e8ebee;
  --surface: #ffffff;
  --surface-2: #f3f5f7;
  --ink: #1a2028;
  --muted: #5b6672;
  --line: #d4d9df;
  --desk: #d3d8de;
  --accent: #c2185b;
  --accent-ink: #ffffff;
  --accent-soft: #fbe3ec;
  --ok: #2f7d4f;
  --warn: #a8670b;
  --bad: #c0392b;
  --shadow: 0 1px 2px rgba(20,30,40,.08), 0 6px 18px rgba(20,30,40,.08);
  --font-display: "CalJost", "Futura", "Century Gothic", system-ui, sans-serif;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --bar-h: 56px;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171b; --surface: #1d2127; --surface-2: #252a31; --ink: #e6e9ec; --muted: #98a2ad;
    --line: #333a43; --desk: #0e1013; --accent: #f06a9e; --accent-ink: #1a0a10; --accent-soft: #3a1626;
    --ok: #5cc28a; --warn: #e5a23a; --bad: #ef6b5e; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171b; --surface: #1d2127; --surface-2: #252a31; --ink: #e6e9ec; --muted: #98a2ad;
  --line: #333a43; --desk: #0e1013; --accent: #f06a9e; --accent-ink: #1a0a10; --accent-soft: #3a1626;
  --ok: #5cc28a; --warn: #e5a23a; --bad: #ef6b5e; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: .01em; }
h2 { font-size: 1.15rem; }
h3 { font-size: .95rem; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

/* ---------- Kopfleiste ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--bar-h); display: flex; align-items: center; gap: 16px;
  padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; white-space: nowrap; }
.cmyk { display: grid; grid-template-columns: 8px 8px; gap: 2px; }
.cmyk i { width: 8px; height: 8px; border-radius: 50%; display: block; }
.cmyk i:nth-child(1) { background: #00a0e3; } .cmyk i:nth-child(2) { background: #e5007e; }
.cmyk i:nth-child(3) { background: #ffd500; } .cmyk i:nth-child(4) { background: var(--ink); }
.steps { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.steps button { border: 0; background: none; padding: 8px 12px; border-radius: 999px; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.steps button b { font-family: var(--font-mono); font-weight: 500; font-size: 11px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); }
.steps button[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); }
.steps button[aria-selected="true"] b { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.bar-right { display: flex; align-items: center; gap: 6px; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); width: 34px; height: 34px; border-radius: var(--r); display: grid; place-items: center; }
.icon-btn:disabled { opacity: .4; cursor: default; }
.icon-btn svg { width: 18px; height: 18px; }
#saveState { font-size: 12px; color: var(--muted); white-space: nowrap; }

.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--accent-soft); border-bottom: 1px solid var(--line); font-size: 13px; }
.banner p { margin: 0; flex: 1; min-width: 200px; }
.banner[hidden] { display: none; }

/* ---------- Allgemeine Bausteine ---------- */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: var(--r); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.small { padding: 5px 10px; font-size: 12.5px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.field { display: grid; gap: 6px; }
.field > label, .lbl { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.range { display: flex; align-items: center; gap: 10px; }
.range input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
.range output { font-family: var(--font-mono); font-size: 12.5px; min-width: 56px; text-align: right; }
select, input[type=text], input[type=number], input[type=url], input[type=password], textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 9px; min-width: 0; }
textarea { width: 100%; resize: vertical; line-height: 1.45; }
input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check span { display: grid; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 7px 12px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); box-shadow: inset 0 0 0 2px var(--surface); }
.swatch[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.card header { display: grid; gap: 2px; }
.card header p { margin: 0; color: var(--muted); font-size: 13px; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }

.view { display: none; }
.view.on { display: block; }

/* ---------- Projekt ---------- */
.project { padding: 20px 16px 40px; max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 380px); gap: 18px; align-items: start; }
.project .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.project .preview { position: sticky; top: calc(var(--bar-h) + 16px); }
.formats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.fmt { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 6px 8px; display: grid; justify-items: center; gap: 6px; font-size: 12px; text-align: center; }
.fmt i { display: block; background: var(--surface-2); border: 1.5px solid var(--muted); border-radius: 2px; }
.fmt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.fmt[aria-pressed="true"] i { border-color: var(--accent); }
.prev-svg { background: var(--desk); border-radius: 10px; padding: 16px; display: grid; place-items: center; }
.prev-svg svg { width: 100%; height: auto; max-height: 420px; display: block; }

/* ---------- Fotos ---------- */
.photos { padding: 16px 16px 120px; max-width: 1400px; margin: 0 auto; display: grid; gap: 14px; }
.ph-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.ph-tools .grow { flex: 1; }
.dropzone { border: 1.5px dashed var(--line); border-radius: 12px; padding: 14px 16px; color: var(--muted); font-size: 13px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.dropzone.over { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.bucket { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.bucket.over { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.bucket h3 { display: flex; align-items: baseline; gap: 8px; }
.bucket h3 .muted { font-family: var(--font-ui); font-weight: 400; font-size: 12px; }
.bucket.unassigned { border-style: dashed; grid-column: 1 / -1; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; min-height: 40px; }
.thumb { position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: var(--surface-2); border: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.thumb.sel { outline: 3px solid var(--accent); outline-offset: -3px; }
.thumb.armed { outline: 3px solid var(--accent); outline-offset: -3px; }
.thumb .b { position: absolute; font-size: 10.5px; line-height: 1; padding: 3px 5px; border-radius: 4px; background: rgba(15,20,25,.72); color: #fff; }
.thumb .b.fav { top: 4px; left: 4px; color: #ffd500; }
.thumb .b.use { bottom: 4px; right: 4px; background: var(--accent); color: var(--accent-ink); }
.thumb .b.lo { top: 4px; right: 4px; background: var(--bad); }
.empty-note { font-size: 12.5px; color: var(--muted); padding: 8px 2px; }
.selbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--surface); border-radius: 14px; padding: 10px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.selbar .btn { background: transparent; color: inherit; border-color: rgba(255,255,255,.25); }
.selbar select { background: var(--ink); color: var(--surface); border-color: rgba(255,255,255,.25); }
.detail { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 14px; align-items: start; }
.detail img { width: 100%; border-radius: 8px; display: block; }
.detail dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

/* ---------- Gestalten ---------- */
#v-design.on { display: grid; grid-template-columns: 148px minmax(0, 1fr) 330px; height: calc(100dvh - var(--top-h, var(--bar-h))); }
.strip { border-right: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 10px; display: grid; gap: 10px; align-content: start; }
.pg { border: 0; background: none; padding: 4px; border-radius: 8px; display: grid; gap: 4px; text-align: left; font-size: 12px; color: var(--muted); }
.pg svg { width: 100%; height: auto; display: block; box-shadow: 0 1px 3px rgba(0,0,0,.18); background: #fff; }
.pg[aria-current="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.pg .warnmark { color: var(--warn); }
.stage { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; min-height: 0; background: var(--desk); }
.stage-tools { display: flex; align-items: center; gap: 10px; padding: 8px 12px; flex-wrap: wrap; background: var(--surface); border-bottom: 1px solid var(--line); }
.stage-tools h2 { margin-right: auto; display: flex; gap: 10px; align-items: baseline; }
.stage-tools h2 .muted { font-family: var(--font-ui); font-size: 12px; font-weight: 400; }
.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); border: 1px solid var(--line); padding: 5px 9px; border-radius: 999px; background: var(--surface); }
.toggle[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
.canvas-wrap { min-height: 0; display: grid; place-items: center; padding: 18px; overflow: hidden; }
#editor { max-width: 100%; max-height: 100%; width: 100%; height: 100%; display: block; touch-action: pan-x pan-y pinch-zoom; user-select: none; -webkit-user-select: none; }
#editor.locked { touch-action: none; }
.canvas-wrap.zoomed { overflow: auto; place-items: start; }
#editor [data-slot] { cursor: pointer; }
#editor .cropping, #editor .cropghost { cursor: grab; }
#editor .selframe { cursor: move; }
#editor .empty { cursor: pointer; }
#editor [data-block] { cursor: move; }
#editor.dragging, #editor.dragging * { cursor: grabbing !important; }
.framebar { background: var(--surface); border-top: 1px solid var(--line); padding: 8px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; min-height: 52px; }
.framebar img { width: 36px; height: 36px; object-fit: cover; border-radius: 4px; }
.framebar .range { min-width: 160px; flex: 1; max-width: 260px; }
.framebar input[type=text] { flex: 1; min-width: 140px; }
.fb-sep { width: 1px; align-self: stretch; background: var(--line); }
.framebar .meta { display: grid; font-size: 12px; line-height: 1.3; min-width: 0; max-width: 200px; }
.framebar .meta b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel { border-left: 1px solid var(--line); background: var(--surface); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; background: none; padding: 12px 6px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab-body { overflow-y: auto; padding: 14px; display: grid; gap: 16px; align-content: start; }
.layouts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.lay { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px; display: grid; gap: 4px; font-size: 10.5px; color: var(--muted); text-align: center; line-height: 1.2; }
.lay svg { width: 100%; height: auto; display: block; }
.lay[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
.caplist { display: grid; gap: 10px; }
.autoplace { display: grid; gap: 6px; padding: 12px; border-radius: 10px; background: var(--accent-soft); }
.autoplace p { margin: 0; }
.bdlist { display: grid; gap: 6px; }
.bdrow { display: grid; grid-template-columns: 64px minmax(0, 1fr) 76px 34px; gap: 6px; align-items: center; }
.bdrow input[data-f="name"] { grid-column: 1 / -1; }
.caprow { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; align-items: center; }
.caprow img { width: 44px; height: 44px; object-fit: cover; border-radius: 4px; }
.cap-month { font-weight: 600; font-size: 12.5px; margin-top: 6px; }

/* ---------- Druck ---------- */
.print { padding: 20px 16px 60px; max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 18px; align-items: start; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.checks li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; font-size: 13px; align-items: start; }
.checks li button:not(.btn) { all: unset; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; background: var(--ok); }
.dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.progress { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.lighttable { background: var(--desk); border-radius: 12px; padding: 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }
.lt-page { display: block; border: 0; background: none; padding: 0; min-width: 0; }
.lt-page svg { width: 100%; height: auto; display: block; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.lt-group { display: grid; gap: 6px; font-size: 12px; color: var(--muted); align-content: start; min-width: 0; }
.lt-group .lt-pages { display: grid; gap: 0; }
.lt-group.row .lt-pages { grid-template-columns: 1fr 1fr; gap: 6px; }
@media (min-width: 600px) { .lt-group.row { grid-column: span 2; } }
.specs { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
.specs dt { color: var(--muted); }
.specs dd { margin: 0; }

/* ---------- Ziehen & Hinweise ---------- */
.ghost { position: fixed; z-index: 100; width: 74px; height: 74px; border-radius: 8px; overflow: hidden; pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,.35); transform: translate(-50%, -60%) rotate(-3deg); border: 2px solid #fff; }
.ghost img { width: 100%; height: 100%; object-fit: cover; }
.ghost span { position: absolute; right: 4px; bottom: 4px; background: var(--accent); color: var(--accent-ink); font-size: 11px; border-radius: 999px; padding: 1px 6px; }
.toast { display: flex; gap: 12px; align-items: center; position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; z-index: 120; font-size: 13px; box-shadow: var(--shadow); max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.on { opacity: 1; }
.busy { position: fixed; inset: 0; z-index: 110; background: rgba(15,20,25,.45); display: grid; place-items: center; padding: 16px; }
.busy .card { width: min(420px, 100%); }

/* ---------- An der Wand ---------- */
/* Eine feste Szene, unabhängig vom Farbschema: helle, leicht strukturierte Wand mit Lichtkegel */
.wall { position: fixed; inset: 0; z-index: 200; touch-action: none; --desk: #cfd2cd; color: #2a2f33;
  background: radial-gradient(circle at 20% 30%, rgba(255,255,255,.18) 0 1px, transparent 2px) 0 0 / 7px 7px,
              radial-gradient(circle at 70% 60%, rgba(0,0,0,.035) 0 1px, transparent 2px) 0 0 / 9px 9px, #cfd2cd;
  display: grid; grid-template-rows: minmax(0, 1fr) auto auto; justify-items: center; padding: calc(28px + env(safe-area-inset-top, 0px)) 16px calc(14px + env(safe-area-inset-bottom, 0px)); overflow: hidden; }
.wall-light { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 70% at 50% 0%, rgba(255,250,240,.55), rgba(255,255,255,0) 70%), linear-gradient(to bottom, rgba(0,0,0,0) 70%, rgba(0,0,0,.08)); pointer-events: none; }
.wall-stage { position: relative; display: grid; place-items: center; min-height: 0; width: 100%; }
.wall-cal { position: relative; perspective: 2400px; transform-origin: 50% 0; cursor: pointer; }
.wall-sheet { position: relative; box-shadow: 0 14px 28px rgba(0,0,0,.22), 0 2px 4px rgba(0,0,0,.18); background: #fff; }
.wall-sheet.ghost { visibility: hidden; }
.wall-sheet svg { width: 100%; height: 100%; display: block; }
.wall-wire { position: absolute; left: 0; pointer-events: none; z-index: 5; overflow: visible; }   /* auch über dem umblätternden Blatt */
.wall-leaf { position: absolute; left: 0; width: 100%; transform-origin: 50% 0; transform-style: preserve-3d; z-index: 4; }
.wall-leaf .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: #fff; box-shadow: 0 14px 28px rgba(0,0,0,.22), 0 2px 4px rgba(0,0,0,.18); }   /* wie .wall-sheet */
.wall-leaf .face.back { transform: rotateX(180deg); clip-path: polygon(-60px -60px, calc(100% + 60px) -60px, calc(100% + 60px) calc(100% + 60px), 100% calc(100% + 60px), 100% 100%, 0 100%, 0 calc(100% + 60px), -60px calc(100% + 60px)); }
/* Rückseite: kein Schatten auf die Monatsseite unter der Bindung (im Ruhezustand liegt sie darüber), seitlich schon */
.wall-leaf .face svg { width: 100%; height: 100%; display: block; }
.wall-leaf .paper-back { width: 100%; height: 100%; background: #f3f3f1; }
.wall-leaf .shade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,.1)); opacity: 0; pointer-events: none; }
.wall-nav { position: relative; display: flex; align-items: center; gap: 18px; margin-top: 18px; }
.wall-btn { width: 46px; height: 46px; border-radius: 50%; border: 0; background: rgba(255,255,255,.85); color: #222; font-size: 26px; line-height: 1; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.wall-btn:disabled { opacity: .35; }
.wall-label { display: grid; justify-items: center; font-family: var(--font-display); min-width: 180px; text-align: center; }
.wall-label b { font-size: 1.25rem; font-weight: 600; }
.wall-label span { font-size: 12.5px; color: #555b60; font-family: var(--font-ui); display: flex; gap: 8px; align-items: center; }
.wall-alt { border: 1px solid rgba(0,0,0,.2); background: rgba(255,255,255,.7); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
.wall-hint { position: relative; font-size: 12px; color: #61676c; margin-top: 8px; text-align: center; }
.wall-close { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 14px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.8); font-size: 24px; line-height: 1; z-index: 5; color: #222; }
.wall :focus-visible { outline: 2px solid #c2185b; outline-offset: 2px; }
html.wall-open, html.wall-open body { overflow: hidden; }
.wallbtn svg { flex: none; }

/* ---------- Ergänzungen aus der UX-Prüfung ---------- */
.toast.on.has-act { pointer-events: auto; }
/* left: 50 % ließe der Meldung nur die halbe Breite; so nimmt sie, was der Text braucht (höchstens Bildschirm minus Rand) */
.toast { width: max-content; }
@media (max-width: 600px) { .toast.has-act { flex-wrap: wrap; } .toast.has-act .toast-act { margin-left: auto; } }
.toast-act { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 5px 10px; font-weight: 600; white-space: nowrap; }
body[data-view="design"] .toast { bottom: calc(118px + env(safe-area-inset-bottom, 0px)); }
.card.notice { border-color: var(--warn); }
.card.cta { grid-template-columns: minmax(0, 1fr) auto; align-items: center; background: var(--accent-soft); border-color: transparent; }
.card.cta h2 { margin-bottom: 4px; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; justify-self: start; font-size: 13px; }
.checks li > span { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.fixbtn { padding: 2px 9px; font-size: 12px; }
.bdquick input[type=text] { flex: 1; min-width: 120px; }
.bdquick input[type=number] { width: 70px; }
.done-box { display: grid; gap: 6px; padding: 12px; border-radius: 10px; background: var(--accent-soft); }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 150; }
.specs-box summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.specs-box[open] { display: grid; gap: 12px; }
.lt-head { display: flex !important; justify-content: space-between; align-items: start; gap: 12px; flex-wrap: wrap; }
.mobile-only { display: none; }
@media (min-width: 981px) { .framebar { min-height: 96px; align-content: center; } }
@media (max-width: 980px) {
  .wallbtn { display: none; }
  .mobile-only { display: inline-flex; }
  /* Handy: Seite bleibt oben sichtbar, Werkzeuge und Fotos scrollen darunter */
  .stage { position: sticky; top: var(--top-h, var(--bar-h)); z-index: 12; box-shadow: 0 6px 12px rgba(0,0,0,.12); }
  .stage-tools { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: 6px 10px; }
  .stage-tools h2 { font-size: 1rem; white-space: nowrap; }
  .stage-tools .row { flex-wrap: nowrap; }
  .stage-tools .vz { display: none; }
  .framebar > * { flex: none; }
  .framebar .meta { max-width: 150px; }
  .canvas-wrap { padding: 8px 16px; }
  #editor { max-height: 44vh; }
  .framebar { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; min-height: 52px; }
  .framebar .range { min-width: 150px; }
  .photos { padding-bottom: 220px; }
  .card.cta { grid-template-columns: minmax(0, 1fr); }
  body[data-view="design"] .toast { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------- Schmal ---------- */
@media (max-width: 980px) {
  .project, .print { grid-template-columns: minmax(0, 1fr); }
  .project .preview { position: static; order: -1; }
  #v-design.on { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto; height: auto; }
  .strip { border-right: 0; border-bottom: 1px solid var(--line); display: flex; overflow-x: auto; overflow-y: hidden; gap: 6px; padding: 8px; }
  .pg { flex: 0 0 74px; }
  .stage { grid-template-rows: auto auto auto; }
  .canvas-wrap { padding: 14px 16px; }
  #editor { height: auto; }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
  .tab-body { overflow: visible; padding: 14px 16px 40px; }
  .brand span:last-child { display: none; }
  .steps button { padding: 8px 9px; }
  #saveState { display: none; }
  .wallbtn .t { display: none; }
}
@media (max-width: 560px) {
  .steps button .t { display: none; }
  .steps button[aria-selected="true"] .t { display: inline; }
  .detail { grid-template-columns: 100px minmax(0, 1fr); }
  .formats { grid-template-columns: repeat(2, 1fr); }
  .banner { font-size: 12.5px; padding: 8px 16px; gap: 8px; }
  .board { grid-template-columns: minmax(0, 1fr); }
}

/* ----- Lokaler Dienst: Projektwahl, Projektordner, Nur ansehen ----- */
.picker { position: fixed; inset: 0; z-index: 120; display: grid; place-items: center; padding: 16px; overflow: auto;
  background: radial-gradient(circle at 20% 10%, var(--accent-soft), transparent 55%), var(--bg); }
.picker-box { width: min(520px, 100%); background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 28px; display: grid; gap: 14px; }
.picker.working .picker-box { opacity: .6; pointer-events: none; }
.picker-brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; font-size: 18px; }
.picker h1 { font-family: var(--font-display); font-weight: 600; font-size: 28px; line-height: 1.15; margin: 4px 0 0; }
.picker .hint { margin: 0; }
.picker-tabs { width: 100%; }
.picker-tabs button, .picker-where button { flex: 1; }
.picker-where { width: 100%; }
.picker-list { display: grid; gap: 8px; max-height: 46vh; overflow: auto; }
.picker-item { display: grid; gap: 2px; text-align: left; padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; }
.picker-item:hover, .picker-item:focus-visible { border-color: var(--accent); background: var(--accent-soft); }
.picker-item b { font-size: 15px; }
.picker-item span { font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.picker-form { display: grid; gap: 12px; }
.picker-form input { font-family: var(--font-mono); }
.picker-form input[name="username"], .picker-form input[name="password"] { font-family: var(--font-ui); }
.picker-form input[name="title"] { font-family: var(--font-ui); }

/* ----- Druck-PDF ----- */

/* ----- Druckansicht (Softproof) ----- */
.canvas-wrap[data-proof]:not([data-proof=""])::before { content: attr(data-proof); position: sticky; top: 8px; left: 8px; z-index: 2; display: inline-block;
  margin: 0 0 6px; padding: 4px 10px; border-radius: 999px; background: var(--ink); color: var(--surface); font-size: 12px; box-shadow: var(--shadow); }
.wall-proof { position: absolute; top: 16px; left: 16px; z-index: 3; padding: 7px 14px; border-radius: 999px; border: 1px solid rgba(0,0,0,.12);
  background: rgba(255,255,255,.85); color: #1a2028; font: inherit; font-size: 13px; cursor: pointer; backdrop-filter: blur(6px); }
.wall-proof[aria-pressed="true"] { background: #1a2028; color: #fff; }
.proof-opts { gap: 8px; }

/* ----- Gestaltung des Kalendariums ----- */
.caltiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.caltile { display: grid; gap: 4px; padding: 8px 8px 6px; border: 1px solid var(--line); border-radius: var(--r); background: #fff; color: #1a2028; text-align: left; cursor: pointer; }
.caltile svg { width: 100%; height: 46px; display: block; }
.caltile span { font-size: 12px; color: #5b6470; }
.caltile[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
.caltile[aria-pressed="true"] span { color: #1a2028; font-weight: 600; }
.caldetails { margin-top: 8px; }

.caldetails[open] > summary { margin-bottom: 6px; }
.caldetails .field { margin-bottom: 10px; }

/* ----- Bild verbessern (Leiste unter dem Bild) ----- */
.framebar.tuning { display: grid; gap: 10px; align-items: stretch; overflow: visible; }

.adj output { font-family: var(--font-mono); color: var(--ink); }
/* Regler mit Null in der Mitte: Spur mit Mittelmarke statt Füllung von links */
.adj input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; }
.adj input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, transparent calc(50% - 1px), var(--muted) calc(50% - 1px), var(--muted) calc(50% + 1px), transparent calc(50% + 1px)), var(--line); }
.adj input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, transparent calc(50% - 1px), var(--muted) calc(50% - 1px), var(--muted) calc(50% + 1px), transparent calc(50% + 1px)), var(--line); }
.adj input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--accent); }

@media (max-width: 980px) {

}

.auto-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink, #fff); }

.loupe.loading .loupe-view::after { content: ""; position: absolute; right: 8px; top: 8px; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.9); border-top-color: transparent; border-radius: 50%; animation: loupe-spin .8s linear infinite; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }

function bindingConf(type) {

}
function bindZoneDepth() {

function holePositions() {

  const c = bindingConf(B.type), n = Math.floor((W - 16) / c.p), x0 = (W - n * c.p) / 2, out = [];

function bindingSvg(ed, flip = false) {
  const B = S.doc.bind, W = S.doc.w, b = S.doc.bleed;

  if (B.type !== 'none') {
    const c = bindingConf(B.type);
    for (const x of holePositions()) {
      s += c.round ? `<circle cx="${x}" cy="${c.cy}" r="${c.hw / 2}" fill="var(--desk)" stroke="#000" stroke-opacity=".25" stroke-width=".2"/>`

      if (ed) s += `<rect x="${x - 1.5}" y="${-6}" width="3" height="${c.cy + 6 + c.hh / 2 - .8}" rx="1.5" fill="none" stroke="#8d969f" stroke-width=".7"/>`;

    s += `<path d="M${l} ${top}L${l} 0A${B.cutW / 2} ${B.cutD} 0 0 0 ${r} 0L${r} ${top}Z" fill="var(--desk)"/>`;

/* ---------- Fotos auf Seiten verteilen ---------- */
function autoFill(key, used = null) {
  const p = S.pages[key]; if (!p || !slotLayout(p)) return 0;
  // Hintergrund des Registers: ein Rückblick aufs Jahr darf Fotos aus dem Kalender zeigen, nur nicht doppelt auf der Seite
  if (isIndex(key)) used = new Set(visibleSlots(p).map(s => s.photo).filter(Boolean));
  used ||= new Set(Object.keys(usage()));
  const m = pageMonth(key);
  let cand = Object.values(S.photos).filter(ph => !used.has(ph.id) && (m == null ? true : ph.month === m));
  if (m == null) cand.sort((a, b) => b.fav - a.fav);
  const rects = slotRects(p).filter(r => { const s = slotOf(p, r.i); return !s.photo || !S.photos[s.photo]; }).sort((a, b) => b.w * b.h - a.w * a.h);
  let n = 0;
  // Bewertung: Favorit, passendes Seitenverhältnis und vor allem genug Auflösung für den Rahmen
  const score = (ph, r) => {
    const d = dpiOf(ph, placeImage(r, ph, newSlot())), want = r.w / r.h;
    return (ph.fav ? .6 : 0) - Math.abs(Math.log(ph.w / ph.h / want)) - (d < DPI_BAD ? 3 : d < DPI_WARN ? 1 : 0);
  };
  for (const r of rects) {
    if (!cand.length) break;
    cand.sort((a, b) => score(b, r) - score(a, r));
    const ph = cand.shift(); used.add(ph.id);
    Object.assign(slotOf(p, r.i), { photo: ph.id, zoom: 1, cx: .5, cy: .5, rot: 0, fit: 'cover' }); n++;
    applyFaces(p, r.i);                                              // Gesichter im Ausschnitt halten (wenn schon bekannt)
  }
  return n;
}

// timeout: { ms, value, when }: nach ms mit value schließen, wenn when() dann noch zutrifft (z. B. niemand am Rechner)
function ask({ title, text, buttons, timeout }) {
  return new Promise((resolve) => {
    const el = document.createElement('div'); el.className = 'busy'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
    el.innerHTML = `<div class="card"><h2>${esc(title)}</h2><p class="hint">${esc(text)}</p><div class="row">${buttons.map((b, i) => `<button class="btn ${b.primary ? 'primary' : ''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div></div>`;
    let timer = null;
    const done = (v) => { clearTimeout(timer); document.removeEventListener('keydown', key, true); el.remove(); resolve(v); };
    if (timeout) timer = setTimeout(() => { if (!timeout.when || timeout.when()) done(timeout.value); }, timeout.ms);   // einmal prüfen, nicht wiederholt
    const key = (e) => { if (e.key === 'Escape') { e.stopPropagation(); done(buttons[buttons.length - 1].value); } };
    el.addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (b) done(buttons[+b.dataset.i].value); });
    document.addEventListener('keydown', key, true);
    document.body.appendChild(el);
    (el.querySelector('.btn.primary') || el.querySelector('.btn')).focus();
  });
}

/* Einrasten an Seitenrändern, Beschnitt, Außenrand, Mitte und an anderen Rahmen (auch mit Bildabstand) */

const MIN_FRAME = 8;

// Bedienung:
// - Rahmen antippen wählt ihn aus (Eckpunkte erscheinen). Ausgewählten Rahmen ziehen verschiebt ihn.
// - Doppelklick bzw. doppeltes Antippen: Ausschnitt-Modus. Dort Foto ziehen, Mausrad und zwei Finger zoomen.
// - Mit der Maus einen nicht ausgewählten Rahmen mit Foto auf einen anderen ziehen: Fotos tauschen.

  svg.classList.toggle('locked', ui.crop != null || ui.selBlock != null || ui.sel != null);

  svg.addEventListener('pointerdown', (e) => {
    if (e.button > 0) return;

      g.type = 'pinch'; g.d0 = Math.max(15, Math.hypot(a.x - b.x, a.y - b.y)); g.z0 = slotOf(p, g.slot).zoom || 1;

      g = { type: 'pan', slot: key, start: pt, cx: sl.cx, cy: sl.cy, moved: false, ghost: !!e.target.closest('.cropghost') };
    } else if (block) {
      // Mit der Maus direkt ziehen; mit dem Finger erst antippen, dann ziehen
      const kind = block.dataset.block;
      const it = pageItems(p).find(x => x.t === 'block' && x.kind === kind);
      g = e.pointerType === 'mouse' || ui.selBlock === kind ? { type: 'block', kind, start: pt, it, el: block, moved: false } : { type: 'selblock', kind, start: pt };

async function loadSaved() {
  const json = await DB.get('kv', 'state');
  if (!json) return false;
  try {
    const o = JSON.parse(json);
    S = { doc: withDefaults(o.doc), pages: o.pages || {}, photos: o.photos || {}, demo: !!o.demo };
    // Älterer Stand: „Rückseiten mit Fotos“ entspricht beidseitig mit freien Rückseiten
    if (o.doc && o.doc.backs && o.doc.duplex == null) { S.doc.duplex = true; S.doc.viewMode = 'free'; }
    delete S.doc.backs;
    // Stand aus der Zeit, als es nur Deutsch gab: Kalender bleibt deutsch
    if (o.doc && !o.doc.calLang) S.doc.calLang = 'de';
    for (const [k, p] of Object.entries(S.pages)) if (isBack(k) && p.cal && p.cal.style === 'off' && Object.keys(p.cal).length === 1) p.cal = {};
  } catch (e) { return false; }

  let past = []; try { past = JSON.parse(await DB.get('kv', 'hist') || '[]'); } catch (e) { past = []; }
  const keep = new Set();
  for (const sj of past) { try { const o = JSON.parse(sj); for (const [id, p] of Object.entries(o.photos || {})) { keep.add(id); if (p.copyOf) keep.add(p.copyOf); } } catch (e) { /* egal */ } }
  hist.past = past;
  const ids = await DB.keys('blobs') || [];
  for (const id of ids) {
    if (String(id).startsWith('font:')) continue;                 // eigene Schriften (b8_fonts.js), keine Fotos
    const rec = await DB.get('blobs', id);
    if (!S.photos[id] && !keep.has(id) && !Object.values(S.photos).some(p => p.copyOf === id)) { DB.del('blobs', id); continue; }
    if (rec) { setUrls(id, rec.prev, rec.thumb); if (rec.file) RT.file[id] = rec.file; }

    RT.prev[ph.id] = RT.prev[ph.copyOf]; RT.thumb[ph.id] = RT.thumb[ph.copyOf]; if (RT.file[ph.copyOf]) RT.file[ph.id] = RT.file[ph.copyOf];

/* ----- Nur ansehen ----- */
// Solange woanders bearbeitet wird, ist der Kalender hier zum Ansehen da: blättern, Wand, Druckansicht, Drucklupe,
// PDF-Entwurf. Was etwas ändern würde, wird gar nicht erst ausgeführt (sonst ginge es beim Übernehmen verloren);

// Aktionen, die nichts am Kalender ändern; alle anderen sind beim Ansehen gesperrt
const VIEW_ACTIONS = new Set(['go', 'tab', 'page', 'nextpage', 'prevpage', 'jump', 'tg', 'vzoom', 'wall', 'ltmode', 'lang',

function refuseEdit() {

// Stand der anderen Person übernehmen, ohne die Ansicht zu verlieren (Seite, Bereich, Bildlauf)

  const after = JSON.parse(snap()), same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const docChanged = !same(before.doc, after.doc), pages = pageKeys().filter(k => !same(before.pages[k], after.pages[k]));
  if (!docChanged && !pages.length && same(before.photos, after.photos)) return;
  SVC.live = { at: Date.now(), what: docChanged ? _t('Gestaltung') : pages.length ? pageLabel(pages[0]) + (pages.length > 1 ? ' …' : '') : _t('Fotos') };

/* ----- Speichern ----- */
const editorState = () => ({ v: 1, doc: S.doc, pages: S.pages });
// Bildtext, Favorit und Aussortieren je Foto; nur Abweichungen vom Stand des Dienstes (oder alles)
function photoMeta(all = false) {
  const out = {};
  for (const a of Object.values(SVC.assets)) {
    if (!usable(a)) continue;
    const ph = S.photos[a.id];
    const want = ph ? { caption: ph.caption || '', favorite: !!ph.fav, excluded: false } : { excluded: true };
    const diff = {};
    for (const k in want) if (all || want[k] !== (k === 'caption' ? a.caption || '' : !!a[k])) diff[k] = want[k];
    if (Object.keys(diff).length) out[a.id] = diff;
  }
  return out;
}
function scheduleServiceSave() {
  if (!SVC.pid) return;
  if (SVC.readOnly) {
    setSaveState(_t('Nur ansehen – nicht gespeichert'));
    if (!SVC.warnedRO) { SVC.warnedRO = true; toast(_t('Nur ansehen: Änderungen werden nicht gespeichert, solange das Projekt woanders bearbeitet wird.'), 7000); }
    return;
  }

  clearTimeout(SVC.timer); SVC.timer = setTimeout(() => serial(serviceSave), 800);
}
function flushSave() {
  if (!SVC.pending) return SVC.queue;
  clearTimeout(SVC.timer);
  return serial(serviceSave);
}
async function serviceSave() {
  if (!SVC.pending || SVC.readOnly || !SVC.pid) return;
  SVC.pending = false;
  try {
    const touched = await syncPhotoFiles();
    const meta = photoMeta();
    await api(PP('/save'), { method: 'POST', body: { editor: editorState(), calendarYear: S.doc.year,
      format: { id: S.doc.format, widthMm: S.doc.w, heightMm: S.doc.h, bleedMm: S.doc.bleed }, assets: meta, printerProfileId: S.doc.printer || '' } });
    for (const [id, m] of Object.entries(meta)) Object.assign(SVC.assets[id], m);
    if (SVC.offline) SVC.offline = false;
    setSaveState(SVC.pending ? _t('Ungespeichert …') : _t('Im Projektordner gespeichert'));
    if (touched && ui.view === 'photos') renderPhotos();
  } catch (e) {
    if (e.status === 423) { lockLost(); return; }
    SVC.pending = true;
    if (e instanceof TypeError) {               // Dienst nicht erreichbar: später noch einmal
      SVC.offline = true; setSaveState(_t('Dienst nicht erreichbar – wird nachgeholt'));
      clearTimeout(SVC.timer); SVC.timer = setTimeout(() => serial(serviceSave), 5000);
    } else { setSaveState(_t('Speichern fehlgeschlagen')); toast(_t('Speichern fehlgeschlagen: {error}', { error: e.message }), 8000, { label: _t('Noch einmal'), fn: () => serial(serviceSave) }); }
  }
}
// Monatswechsel und Kopien der Oberfläche als Dateioperationen nachziehen
async function syncPhotoFiles() {
  let touched = false;
  const facts = {};                             // neue Pfade, auch im aktuellen Verlaufsstand nachtragen
  for (const ph of Object.values(S.photos)) {
    const a = SVC.assets[ph.id], want = ph.month < 0 ? null : ph.month;
    if (!a) {
      // In der Oberfläche angelegte Kopie: jetzt als eigene Datei im Monatsordner anlegen
      const src = ph.copyOf && SVC.assets[ph.copyOf] ? ph.copyOf : null;
      if (!src) { delete S.photos[ph.id]; continue; }
      try {
        const c = gotAsset(await api(PP(`/assets/${src}/copy`), { method: 'POST', body: { month: want } }));
        renamePhoto(ph.id, c.id); Object.assign(S.photos[c.id], fileFacts(c)); facts[c.id] = fileFacts(c); touched = true;
      } catch (e) { if (e.status === 423) throw e; toast(_t('Kopie konnte nicht angelegt werden: {error}', { error: e.message }), 7000); }
      continue;
    }
    if ((a.month ?? null) === want || a.status === 'missing') continue;
    try {
      const m = gotAsset(await api(PP(`/assets/${ph.id}/move`), { method: 'POST', body: { month: want } }));
      Object.assign(ph, { path: m.path, name: baseName(m.path) }); facts[ph.id] = { path: m.path, name: baseName(m.path) }; touched = true;
    } catch (e) {
      if (e.status === 423) throw e;
      ph.month = a.month ?? -1;                 // Datei liegt weiter im alten Ordner
      toast(_t('„{name}“ konnte nicht verschoben werden: {error}', { name: ph.name, error: e.message }), 8000);
    }
  }
  // Nur die Dateiangaben nachtragen, nicht den ganzen Zustand: ein gerade laufendes Ziehen bleibt so ein eigener Schritt
  if (touched && hist.last) { const o = JSON.parse(hist.last); for (const [id, f] of Object.entries(facts)) if (o.photos[id]) Object.assign(o.photos[id], f); hist.last = JSON.stringify(o); }
  return touched;
}

/* ----- Abgleich mit den Monatsordnern ----- */
function serviceScan(manual) {
  if (!SVC.pid) return Promise.resolve();
  if (SVC.readOnly) { if (manual) toast(_t('Nur ansehen: Abgleichen geht erst, wenn das Projekt frei ist.')); return Promise.resolve(); }
  clearTimeout(SVC.timer);
  return serial(async () => {
    await serviceSave();
    setSaveState(_t('Ordner wird abgeglichen …'));
    SVC.lastScan = Date.now();
    try {
      const rep = await api(PP('/scan'), { method: 'POST' });
      const list = await api(PP('/assets'));
      const ids = new Set([...rep.added, ...rep.moved, ...rep.changed, ...rep.missing, ...rep.reassigned]);
      SVC.info = await api(PP());
      if (ids.size) {
        const byId = Object.fromEntries(list.map(a => [a.id, a]));
        for (const id of ids) {
          const a = byId[id]; if (!a) continue;
          gotAsset(a);
          if (a.excluded || !usable(a)) continue;
          S.photos[id] = photoFromAsset(a, S.photos[id]);
        }
        rebaseHistory(o => { for (const id of ids) { const a = byId[id]; if (!a || a.excluded || !usable(a)) continue; o.photos[id] = o.photos[id] ? { ...o.photos[id], ...fileFacts(a) } : photoFromAsset(a); } });
        for (const id of rep.changed) delete FACES.map[id];
        renderAll();
        prefetchFaces();
      }
      setSaveState(_t('Im Projektordner gespeichert'));
      const parts = [];
      if (rep.added.length) parts.push(plural(rep.added.length, _t('neues Foto'), _t('neue Fotos')));
      const resorted = new Set([...rep.moved, ...rep.reassigned]).size;
      if (resorted) parts.push(_t('{n} umsortiert', { n: resorted }));
      if (rep.changed.length) parts.push(_t('{n} geändert', { n: rep.changed.length }));
      if (rep.missing.length) parts.push(_t('{n} fehlen', { n: rep.missing.length }));

/* ---------- Druck-PDF über den lokalen Dienst ----------

  return PRN.tune[pr.id];
}

const pdfxOf = (pr = printerOf()) => (pr && pr.iccVersion >= 4) ? 'x4' : (S.doc.pdfx === 'x4' ? 'x4' : 'x1a');

function proofUrl(id, small) {

/* ---------- Gesichter ----------
   Der lokale Dienst findet Gesichter (wo, nicht wer). Damit
   - hält der automatische Ausschnitt Gesichter im Bild, mit etwas Luft über den Köpfen,
   - meidet das Kalendarium Gesichter, wenn es seinen Platz sucht,
   - meldet die Prüfliste angeschnittene oder verdeckte Gesichter.
   Ohne Dienst (oder ohne OpenCV im Dienst) bleibt alles wie bisher. */
const FACES = { on: null, map: {}, loading: null };       // on: null = noch unbekannt, false = nicht verfügbar
const faceAsset = (ph) => (SVC.assets[ph.id] ? ph.id : ph.copyOf);
const facesOf = (id) => { const ph = S.photos[id]; return ph ? FACES.map[faceAsset(ph)] || null : null; };
const facesReady = () => !!SVC.pid && FACES.on !== false;

async function loadFaces(ids, bar = null) {
  if (!facesReady()) return;
  const want = [...new Set(ids.map(id => S.photos[id] && faceAsset(S.photos[id])).filter(a => a && SVC.assets[a] && !(a in FACES.map)))];
  for (let i = 0; i < want.length; i += 24) {
    if (bar) bar.update(i / want.length, _t('Gesichter werden gesucht …'));
    try {
      const r = await api(PP('/faces'), { method: 'POST', body: { ids: want.slice(i, i + 24) } });
      FACES.on = !!r.available; if (!r.available) return;
      Object.assign(FACES.map, r.faces);
    } catch (e) { console.warn('Gesichter', e); return; }
  }
}
// Im Hintergrund für alle Fotos vorab holen; der Dienst merkt sich die Ergebnisse
function prefetchFaces() {
  if (!facesReady() || FACES.loading) return;
  FACES.loading = loadFaces(Object.keys(S.photos)).finally(() => { FACES.loading = null; refreshFaces(); });
}

// Nach dem Laden: Editor (Hinweise auf Gesichter) neu zeichnen, falls er gerade zu sehen ist
const refreshFaces = () => { if (ui.view === 'design' && $('#canvasWrap')) { renderEditor(); updateThumb(); } };

const weightOf = (f) => Math.pow(f.w * f.h, .75) * (f.score || 1);
const overlap = (a, b) => { const r = intersect(a, b); return r ? r.w * r.h : 0; };

// Bester Ausschnitt (cx, cy) für „Füllen“ ohne Drehung: alle wichtigen Gesichter ganz im sichtbaren Teil
// (Beschnitt und 3 mm Rand zählen nicht), lieber ein Gesicht ganz weglassen als es anschneiden; dazu Gesichter
// waagrecht mittig und auf etwa 40 % der Höhe.
function faceCrop(r, ph, sl) {
  const fs = facesOf(ph.id);
  if (!fs || !fs.length || sl.fit === 'contain' || (sl.rot || 0) !== 0) return null;
  const pl = placeImage(r, ph, sl), dw = pl.w, dh = pl.h;
  const V = intersect(r, { x: 3, y: 3, w: S.doc.w - 6, h: S.doc.h - 6 }); if (!V) return null;
  const ex = Math.min(.5, r.w / 2 / dw), ey = Math.min(.5, r.h / 2 / dh), steps = 40;
  let best = null;
  for (let a = 0; a <= steps; a++) for (let b = 0; b <= steps; b++) {
    const cx = ex + (1 - 2 * ex) * a / steps, cy = ey + (1 - 2 * ey) * b / steps;
    const win = { x: cx + (V.x - pl.fx) / dw, y: cy + (V.y - pl.fy) / dh, w: V.w / dw, h: V.h / dh };
    let s = 0, U = null;
    for (const f of fs) {
      const vis = overlap(f, win) / (f.w * f.h), w = weightOf(f);
      if (vis > .97) { s += w; U = U ? union(U, f) : { ...f }; } else if (vis > .03) s += w * (vis * .3 - .6);
    }
    if (U) s -= (Math.abs(U.x + U.w / 2 - (win.x + win.w / 2)) / win.w + Math.abs((U.y + U.h / 2 - win.y) / win.h - .4)) * .15 * weightOf(fs[0]);
    s -= .01 * Math.hypot(cx - .5, cy - .5) * weightOf(fs[0]);
    if (!best || s > best.s) best = { s, cx, cy };
  }
  return best && { cx: best.cx, cy: best.cy };
}
const union = (a, b) => { const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y); return { x, y, w: Math.max(a.x + a.w, b.x + b.w) - x, h: Math.max(a.y + a.h, b.y + b.h) - y }; };
const defaultCrop = (sl) => (sl.zoom || 1) === 1 && (sl.cx ?? .5) === .5 && (sl.cy ?? .5) === .5 && !(sl.rot || 0) && sl.fit !== 'contain';

// Ausschnitt eines Rahmens an Gesichtern ausrichten, wenn er noch unverändert ist. true, wenn sich etwas geändert hat.
function applyFaces(p, i) {
  const sl = slotOf(p, i), ph = sl && sl.photo && S.photos[sl.photo], r = ph && rectOf(p, i);
  if (!r || !defaultCrop(sl)) return false;
  const c = faceCrop(r, ph, sl); if (!c) return false;
  sl.cx = c.cx; sl.cy = c.cy; return true;
}
// Wie applyFaces, aber lädt fehlende Gesichter erst nach (dann eigener Schritt im Verlauf)
async function applyFacesLater(key, i) {
  const p = S.pages[key], sl = p && slotOf(p, i); if (!sl || !sl.photo || facesOf(sl.photo)) return;
  const photo = sl.photo;
  await loadFaces([photo]);
  if (S.pages[key] === p && slotOf(p, i).photo === photo && applyFaces(p, i)) { commit(); refreshFaces(); }
}

// Gesichter einer Seite in Seiten-mm, mit dem Anteil, der im Endformat sichtbar ist
function pageFaces(p) {
  const W = S.doc.w, H = S.doc.h, out = [];
  for (const it of pageItems(p, { noBlocks: true })) {
    if (it.t !== 'img') continue;
    const ph = S.photos[it.photo], fs = facesOf(it.photo); if (!fs) continue;
    const pl = it.place, th = (pl.rot || 0) * Math.PI / 180, cs = Math.cos(th), sn = Math.sin(th);
    const pt = (u, v) => { const dx = (u - pl.cx) * pl.w, dy = (v - pl.cy) * pl.h; return [pl.fx + dx * cs - dy * sn, pl.fy + dx * sn + dy * cs]; };
    const vis = intersect(it.clip, { x: 0, y: 0, w: W, h: H });
    for (const f of fs) {
      const P = [pt(f.x, f.y), pt(f.x + f.w, f.y), pt(f.x, f.y + f.h), pt(f.x + f.w, f.y + f.h)];
      const x = Math.min(...P.map(q => q[0])), y = Math.min(...P.map(q => q[1]));
      const box = { x, y, w: Math.max(...P.map(q => q[0])) - x, h: Math.max(...P.map(q => q[1])) - y };

  };
  const key = (e) => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } };

/* ---------- Wer ist wie oft auf den Fotos ----------
   Der lokale Dienst liefert je Gesicht 128 Merkmale (SFace); hier werden ähnliche Gesichter zu Personen gruppiert

   im Kalender – damit niemand aus der Familie zu kurz kommt. Namen stehen im Projekt nur als Name plus Verweis auf
   ein Beispielgesicht (Prüfsumme des Fotos und Nummer des Gesichts); Gesichtsmerkmale kommen nie ins Projekt. */
const PEOPLE = { ready: null, faces: {}, groups: null, key: '', busy: false };
const PEOPLE_SIM = .40;

async function peopleStatus() {
  if (!SVC.pid) return false;
  if (PEOPLE.ready === null) { try { PEOPLE.ready = !!(await api('people/model')).ready; } catch (e) { PEOPLE.ready = false; } }
  return PEOPLE.ready;
}
async function loadPeopleFaces(ids, bar) {
  const want = [...new Set(ids.map(id => S.photos[id] && faceAsset(S.photos[id])).filter(a => a && SVC.assets[a] && !(a in PEOPLE.faces)))];
  for (let i = 0; i < want.length; i += 16) {
    if (bar) bar.update(i / want.length, _t('{n} von {total}', { n: i, total: want.length }));
    const r = await api(PP('/people'), { method: 'POST', body: { ids: want.slice(i, i + 16) } });
    if (!r.ready) return false;
    Object.assign(PEOPLE.faces, r.faces);
  }

}
const dot = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; };
const unit = (v) => { const n = Math.hypot(...v) || 1; return v.map(x => x / n); };

// Gesichter zu Personen gruppieren; je Person die Fotos (Original-IDs, Kopien zählen nicht doppelt)
function groupPeople() {
  const faces = [];
  for (const [asset, list] of Object.entries(PEOPLE.faces)) (list || []).forEach((f, i) => { if (f.emb) faces.push({ asset, i, f, area: f.w * f.h }); });
  faces.sort((a, b) => b.area - a.area);

  for (const x of faces) {
    let best = null, sim = PEOPLE_SIM;
    for (const g of groups) { const s = dot(g.c, x.f.emb); if (s > sim) { sim = s; best = g; } }
    if (!best) { best = { sum: x.f.emb.map(() => 0), c: x.f.emb, faces: [], assets: new Set() }; groups.push(best); }
    best.faces.push(x); best.assets.add(x.asset);
    best.sum = best.sum.map((v, k) => v + x.f.emb[k]); best.c = unit(best.sum);
  }
  const named = S.doc.people || [];
  return groups.filter(g => g.assets.size >= 2).map(g => {
    const refs = new Set(g.faces.map(x => faceRef(x.asset, x.i)));
    const person = named.find(p => refs.has(p.ref));
    return { faces: g.faces, assets: g.assets, rep: g.faces[0], name: person ? person.name : '', ref: person ? person.ref : faceRef(g.faces[0].asset, g.faces[0].i) };
  }).sort((a, b) => b.assets.size - a.assets.size);
}
// Fotos (IDs in S.photos) einer Person und wie oft sie im Kalender steht
function personPhotos(g) { return Object.values(S.photos).filter(ph => g.assets.has(faceAsset(ph))).map(ph => ph.id); }
function personInCalendar(g) { const u = usage(); return personPhotos(g).reduce((n, id) => n + (u[id] ? u[id].filter(k => pageMonth(k) != null || k === 'cover').length : 0), 0); }

function peopleKey() { return Object.keys(PEOPLE.faces).sort().join(',') + '|' + JSON.stringify(S.doc.people || []); }
const facesMissing = () => Object.values(S.photos).some(ph => { const a = faceAsset(ph); return a && SVC.assets[a] && !(a in PEOPLE.faces); });
// Nur rechnen, wenn Fotos oder Namen neu sind, und nur dann neu zeichnen (sonst stößt das Zeichnen das Rechnen wieder an)
function refreshPeople(after) {
  if (!SVC.pid || PEOPLE.busy || S.doc.peopleOff || PEOPLE.ready === false) return;
  if (PEOPLE.ready && PEOPLE.groups && !facesMissing() && PEOPLE.key === peopleKey()) return;
  PEOPLE.busy = true;
  const before = `${PEOPLE.ready}|${PEOPLE.key}`;
  (async () => {
    if (!(await peopleStatus())) return;
    await loadPeopleFaces(Object.keys(S.photos));
    const key = peopleKey();
    if (key !== PEOPLE.key || !PEOPLE.groups) { PEOPLE.groups = groupPeople(); PEOPLE.key = key; }
  })().catch(e => { console.warn('Personen', e); PEOPLE.ready = false; }).finally(() => { PEOPLE.busy = false; if (after && `${PEOPLE.ready}|${PEOPLE.key}` !== before) after(); });
}

// Gesichtsausschnitt als Hintergrund des Vorschaubilds (quadratisch, etwas Luft)
function faceAvatar(x, size = 64) {
  const ph = Object.values(S.photos).find(p => faceAsset(p) === x.asset); if (!ph) return '';
  const f = x.f, W = ph.w, H = ph.h, side = 1.9 * Math.max(f.w * W, f.h * H), sw = Math.min(1, side / W), sh = Math.min(1, side / H);
  const cx = f.x + f.w / 2, cy = f.y + f.h * .45;

  const px = sw < 1 ? x0 / (1 - sw) * 100 : 0, py = sh < 1 ? y0 / (1 - sh) * 100 : 0;
  return `<span class="avatar" style="width:${size}px;height:${size}px;background-image:url('${RT.thumb[ph.id]}');background-size:${100 / sw}% ${100 / sh}%;background-position:${px}% ${py}%"></span>`;
}

/* ---------- Drucklupe ----------
   Zeigt eine Stelle eines Fotos so, wie sie gedruckt wird: der Dienst rechnet sie aus dem Original in voller Größe,
   mit Detailbearbeitung (Rauschen, Struktur, Gegenlicht …), Rezept, Druckausgleich und Ausgabeschärfung, in der
   Auflösung des Druck-PDFs (höchstens 300 dpi) und in der Druckansicht als Softproof. Zwei Maßstäbe:
   „Papiergröße“ (1 cm auf dem Papier ≈ 1 cm am Bildschirm) und „100 %“ (ein Druckpixel je CSS-Pixel).

const loupeAvailable = (ph) => !!(SVC.pid && loupeAsset(ph));

function loupeToggle(on = !ui.loupe) {

  if (!ui.loupe) loupeHide();
  else toast(coarse() ? _t('Drucklupe: Foto antippen oder mit dem Finger darüberfahren.') : _t('Drucklupe: mit der Maus über ein Foto fahren. Esc beendet.'), 4000);

const loupeButton = () => `<button class="btn small" data-act="loupe" aria-pressed="${!!ui.loupe}" title="${esc(_t('Zeigt eine Stelle so, wie sie gedruckt wird: Druckauflösung, Schärfe, Rauschen'))}">🔍 ${_t('Drucklupe')}</button>`;

function loupeSize() {

}
function loupeEl() {
  if (LOUPE.el) return LOUPE.el;

  el.className = 'loupe'; el.hidden = true; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', _t('Drucklupe'));
  document.body.appendChild(el);

}
function loupeRender() {
  const el = loupeEl(), z = LOUPE.zoom;
  el.innerHTML = `<div class="loupe-view"><div class="loupe-ph"></div><img alt=""></div>
    <div class="loupe-bar"><span class="loupe-info num"></span>
      ${seg([['paper', _t('Papiergröße')], ['px', '100 %']], z, 'loupezoom')}
      <button class="loupe-x" data-act="loupe" aria-label="${esc(_t('Drucklupe schließen'))}">×</button></div>`;
  const img = el.querySelector('img');
  img.addEventListener('load', () => { if (img.dataset.src === LOUPE.want) img.classList.add('on'); el.classList.remove('loading'); });
  img.addEventListener('error', () => el.classList.remove('loading'));

function loupeHide() {

}

// Welche Stelle welches Fotos liegt unter dem Punkt? Vorn liegende Rahmen zuerst, Drehung herausgerechnet
function loupeHit(x, y) {
  const svg = $('#editor'); if (!svg) return null;
  const g = document.elementsFromPoint(x, y).map(n => n.closest && n.closest('#editor g[data-slot]')).find(Boolean);
  if (!g) return null;
  const p = curPage(), key = keyOf(g.dataset.slot), r = rectOf(p, key), sl = slotOf(p, key), ph = sl && S.photos[sl.photo];
  if (!r || !loupeAvailable(ph)) return null;
  const m = svg.getScreenCTM(); if (!m) return null;
  const q = new DOMPoint(x, y).matrixTransform(m.inverse());
  if (q.x < r.x || q.y < r.y || q.x > r.x + r.w || q.y > r.y + r.h) return null;
  const pl = placeImage(r, ph, sl), th = -(pl.rot || 0) * Math.PI / 180, dx = q.x - pl.fx, dy = q.y - pl.fy;
  const u = (pl.fx + dx * Math.cos(th) - dy * Math.sin(th) - pl.x) / pl.w, v = (pl.fy + dx * Math.sin(th) + dy * Math.cos(th) - pl.y) / pl.h;

function loupeShow(hit) {
  LOUPE.at = hit;
  const el = loupeEl(); if (!el.firstChild) loupeRender();
  const { ph, pl, u, v } = hit, box = loupeSize();
  const photoPpmm = ph.w / pl.w, ppmm = Math.min(PRINT_PPMM, photoPpmm), scale = ppmm / photoPpmm;   // Druckpixel je Fotopixel
  const k = LOUPE.zoom === 'px' ? 1 : ppmm / CSS_PX_MM;                                               // Druckpixel je CSS-Pixel
  const w = Math.min(1600, Math.round(box.w * k)), h = Math.min(1600, Math.round(box.h * k));
  const bw = w / scale / ph.w;                                                                         // Ausschnitt als Teil der Fotobreite
  el.hidden = false;
  el.style.width = box.w + 'px';
  const view = el.querySelector('.loupe-view'), phEl = el.querySelector('.loupe-ph'), img = el.querySelector('img');
  view.style.height = box.h + 'px';
  // Platzhalter: die Vorschau des Editors, vergrößert (mit demselben Rezept-Filter)
  const bgW = box.w / bw, bgH = bgW * ph.h / ph.w;
  if (hit.href) {
    phEl.style.backgroundImage = `url("${hit.href.replace(/"/g, '%22')}")`;
    phEl.style.backgroundSize = `${bgW}px ${bgH}px`;
    phEl.style.backgroundPosition = `${box.w / 2 - u * bgW}px ${box.h / 2 - v * bgH}px`;
    phEl.style.filter = hit.filter || '';
  }
  const dpi = Math.round(ppmm * 25.4), mmW = w / ppmm, mmH = h / ppmm;
  el.querySelector('.loupe-info').textContent = _t('{dpi} dpi · zeigt {w} × {h} mm', { dpi, w: fmt1(mmW), h: fmt1(mmH) });
  // Lage: neben dem Zeiger, im Fenster
  const gap = 24, vw = window.innerWidth, vh = window.innerHeight, H = el.offsetHeight || box.h + 40;
  let left = hit.x + gap, top = hit.y - H - gap;

  if (coarse()) left = (vw - box.w) / 2;
  if (top < 8) top = Math.min(vh - H - 8, hit.y + gap);
  el.style.left = Math.max(8, left) + 'px'; el.style.top = Math.max(8, top) + 'px';
  // scharfes Bild vom Dienst, sobald der Zeiger kurz ruht
  const a = loupeAsset(ph), c = compileAdjust(adjOf(ph.id)), pr = typeof printerOf === 'function' && PRN.loaded ? printerOf() : null;
  const fx = fxOf(ph.id, false);
  const q = [`cx=${u.toFixed(4)}`, `cy=${v.toFixed(4)}`, `w=${w}`, `h=${h}`, `scale=${scale.toFixed(5)}`, `pw=${ph.w}`,
    fx && 'fx=' + fx, c && 'adj=' + encodeURIComponent(c.m.map(x => +x.toFixed(4)).join(',') + ';' + c.lut.map(x => +x.toFixed(4)).join(',')),
    pr && 'printer=' + encodeURIComponent(pr.id), pr && tuneOn() && 'tune=1', pr && proofOn() && 'proof=1', pr && proofOn() && ui.proofPaper === false && 'paper=0',
    `v=${a.contentHash.slice(0, 12)}`, SVC.token && 'token=' + encodeURIComponent(SVC.token)].filter(Boolean).join('&');
  const url = `api/${PP(`/assets/${a.id}/loupe`)}?${q}`;
  img.style.width = box.w + 'px'; img.style.height = box.h + 'px';
  if (url === LOUPE.want) return;
  LOUPE.want = url; img.classList.remove('on'); el.classList.add('loading');
  clearTimeout(LOUPE.timer);

}
// Nach Änderungen am Foto (Regler, Druckansicht) dieselbe Stelle neu zeigen
function loupeRefresh() {
  if (!ui.loupe || !LOUPE.at) return;
  const hit = loupeHit(LOUPE.at.x, LOUPE.at.y);
  if (hit) loupeShow(hit); else loupeHide();
}

ACTIONS.loupe = () => loupeToggle();
ACTIONS.loupezoom = (el) => { LOUPE.zoom = el.dataset.v; loupeRender(); if (LOUPE.at) loupeShow(LOUPE.at); };

// Maus: der Zeiger führt; Finger: antippen oder darüberfahren (verschiebt dann keinen Rahmen)
document.addEventListener('pointermove', (e) => {
  if (!ui.loupe || ui.view !== 'design') return;
  if (e.pointerType !== 'mouse' && !LOUPE.touch) return;
  if (LOUPE.el && LOUPE.el.contains(e.target)) return;
  const hit = loupeHit(e.clientX, e.clientY);
  if (hit) { loupeShow(hit); if (LOUPE.touch) e.preventDefault(); } else if (e.pointerType === 'mouse') loupeHide();
}, { passive: false });
document.addEventListener('pointerdown', (e) => {
  if (!ui.loupe || ui.view !== 'design' || e.pointerType === 'mouse') return;
  const hit = loupeHit(e.clientX, e.clientY); if (!hit) return;
  LOUPE.touch = true; LOUPE.eat = true; e.preventDefault(); e.stopPropagation();
  loupeShow(hit);
}, true);
document.addEventListener('pointerup', () => { LOUPE.touch = false; }, true);
document.addEventListener('click', (e) => {          // der Tipp für die Lupe wählt keinen Rahmen aus
  if (LOUPE.eat && e.target.closest && e.target.closest('#editor')) { e.stopPropagation(); e.preventDefault(); }
  LOUPE.eat = false;
}, true);
document.addEventListener('pointercancel', () => { LOUPE.touch = false; }, true);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && ui.loupe && !document.querySelector('[aria-modal="true"]')) { e.stopImmediatePropagation(); loupeToggle(false); }   // offener Dialog zuerst
}, true);
/* ---------- Schriften: Überschriften und Kalendarium/Texte ----------
   Zwei Plätze (S.doc.fonts.head und .text), jeweils null = Jost oder { id, family, files: { regular, bold } }.
   Der Kalender setzt Text selbst: Breiten kommen aus der Schrift (FONTS[…].widths), eingebettet wird sie als
   TrueType mit WinAnsi-Kodierung. Schlüssel der Textstücke: 'regular'/'bold' für Kalendarium und Texte,
   'hregular'/'hbold' für Überschriften (Monatsname, Titel). Im Editor heißen die Familien CalText und CalHead.

   Woher die Dateien kommen: mit dem Dienst aus dem Projektordner (.lichtjahr/fonts, auch Google Fonts landen
   dort), ohne Dienst aus dem Browser-Speicher (eigene TrueType-Dateien und Google Fonts von Fontsource). */
const JOST = { regular: FONTS.regular, bold: FONTS.bold };
FONTS.hregular = FONTS.regular; FONTS.hbold = FONTS.bold;
const FONTSTATE = { sig: 'null', loading: null, bytes: {}, faces: [], warned: {}, loaded: { text: null, head: null } };
const FONT_SLOTS = { head: ['hregular', 'hbold'], text: ['regular', 'bold'] };
const fontSig = () => JSON.stringify(S.doc.fonts || null);

const isHeadFont = (key) => key === 'hregular' || key === 'hbold';
const isBoldFont = (key) => key === 'bold' || key === 'hbold';

const fontAttrs = (key) => `font-family="${isHeadFont(key) ? 'CalHead' : 'CalText'},sans-serif" font-weight="${isBoldFont(key) ? 600 : 400}"`;

/* ----- TrueType lesen: Breiten für WinAnsi, Kennzahlen fürs PDF, fehlende Zeichen, Einbett-Recht ----- */
