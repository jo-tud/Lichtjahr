<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 20 20%27%3E%3Ccircle cx=%275%27 cy=%275%27 r=%274%27 fill=%27%2300a0e3%27/%3E%3Ccircle cx=%2715%27 cy=%275%27 r=%274%27 fill=%27%23e5007e%27/%3E%3Ccircle cx=%275%27 cy=%2715%27 r=%274%27 fill=%27%23ffd500%27/%3E%3Ccircle cx=%2715%27 cy=%2715%27 r=%274%27 fill=%27%231a2028%27/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Lichtjahr</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: Werkbank – links die Blätter, in der Mitte der Leuchttisch, rechts das Werkzeug. */
:root {
  --bg: #e8ebee;
  --surface: #ffffff;
  --surface-2: #f3f5f7;
  --ink: #1a2028;
  --muted: #5b6672;
  --line: #d4d9df;
  --desk: #d3d8de;
  --accent: #c2185b;
  --accent-ink: #ffffff;
  --accent-soft: #fbe3ec;
  --ok: #2f7d4f;
  --warn: #a8670b;
  --bad: #c0392b;
  --shadow: 0 1px 2px rgba(20,30,40,.08), 0 6px 18px rgba(20,30,40,.08);
  --font-display: "CalJost", "Futura", "Century Gothic", system-ui, sans-serif;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --bar-h: 56px;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171b; --surface: #1d2127; --surface-2: #252a31; --ink: #e6e9ec; --muted: #98a2ad;
    --line: #333a43; --desk: #0e1013; --accent: #f06a9e; --accent-ink: #1a0a10; --accent-soft: #3a1626;
    --ok: #5cc28a; --warn: #e5a23a; --bad: #ef6b5e; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171b; --surface: #1d2127; --surface-2: #252a31; --ink: #e6e9ec; --muted: #98a2ad;
  --line: #333a43; --desk: #0e1013; --accent: #f06a9e; --accent-ink: #1a0a10; --accent-soft: #3a1626;
  --ok: #5cc28a; --warn: #e5a23a; --bad: #ef6b5e; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: .01em; }
h2 { font-size: 1.15rem; }
h3 { font-size: .95rem; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

/* ---------- Kopfleiste ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--bar-h); display: flex; align-items: center; gap: 16px;
  padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; white-space: nowrap; }
.cmyk { display: grid; grid-template-columns: 8px 8px; gap: 2px; }
.cmyk i { width: 8px; height: 8px; border-radius: 50%; display: block; }
.cmyk i:nth-child(1) { background: #00a0e3; } .cmyk i:nth-child(2) { background: #e5007e; }
.cmyk i:nth-child(3) { background: #ffd500; } .cmyk i:nth-child(4) { background: var(--ink); }
.steps { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.steps button { border: 0; background: none; padding: 8px 12px; border-radius: 999px; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.steps button b { font-family: var(--font-mono); font-weight: 500; font-size: 11px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); }
.steps button[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); }
.steps button[aria-selected="true"] b { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.bar-right { display: flex; align-items: center; gap: 6px; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); width: 34px; height: 34px; border-radius: var(--r); display: grid; place-items: center; }
.icon-btn:disabled { opacity: .4; cursor: default; }
.icon-btn svg { width: 18px; height: 18px; }
#saveState { font-size: 12px; color: var(--muted); white-space: nowrap; }

.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--accent-soft); border-bottom: 1px solid var(--line); font-size: 13px; }
.banner p { margin: 0; flex: 1; min-width: 200px; }

/* ---------- Allgemeine Bausteine ---------- */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: var(--r); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.small { padding: 5px 10px; font-size: 12.5px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.field { display: grid; gap: 6px; }
.field > label, .lbl { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.range { display: flex; align-items: center; gap: 10px; }
.range input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
.range output { font-family: var(--font-mono); font-size: 12.5px; min-width: 56px; text-align: right; }
select, input[type=text], input[type=number], input[type=url], input[type=password], textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 9px; min-width: 0; }
textarea { width: 100%; resize: vertical; line-height: 1.45; }
input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check span { display: grid; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 7px 12px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); box-shadow: inset 0 0 0 2px var(--surface); }
.swatch[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.card header { display: grid; gap: 2px; }
.card header p { margin: 0; color: var(--muted); font-size: 13px; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }

.view { display: none; }
.view.on { display: block; }

/* ---------- Projekt ---------- */
.project { padding: 20px 16px 40px; max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 380px); gap: 18px; align-items: start; }
.project .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.project .preview { position: sticky; top: calc(var(--bar-h) + 16px); }
.formats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.fmt { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 6px 8px; display: grid; justify-items: center; gap: 6px; font-size: 12px; text-align: center; }
.fmt i { display: block; background: var(--surface-2); border: 1.5px solid var(--muted); border-radius: 2px; }
.fmt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.fmt[aria-pressed="true"] i { border-color: var(--accent); }
.prev-svg { background: var(--desk); border-radius: 10px; padding: 16px; display: grid; place-items: center; }
.prev-svg svg { width: 100%; height: auto; max-height: 420px; display: block; }

/* ---------- Fotos ---------- */
.photos { padding: 16px 16px 120px; max-width: 1400px; margin: 0 auto; display: grid; gap: 14px; }
.ph-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.ph-tools .grow { flex: 1; }
.dropzone { border: 1.5px dashed var(--line); border-radius: 12px; padding: 14px 16px; color: var(--muted); font-size: 13px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.dropzone.over { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.bucket { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.bucket.over { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.bucket h3 { display: flex; align-items: baseline; gap: 8px; }
.bucket h3 .muted { font-family: var(--font-ui); font-weight: 400; font-size: 12px; }
.bucket.unassigned { border-style: dashed; grid-column: 1 / -1; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; min-height: 40px; }
.thumb { position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: var(--surface-2); border: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.thumb.sel { outline: 3px solid var(--accent); outline-offset: -3px; }
.thumb.armed { outline: 3px solid var(--accent); outline-offset: -3px; }
.thumb .b { position: absolute; font-size: 10.5px; line-height: 1; padding: 3px 5px; border-radius: 4px; background: rgba(15,20,25,.72); color: #fff; }
.thumb .b.fav { top: 4px; left: 4px; color: #ffd500; }
.thumb .b.use { bottom: 4px; right: 4px; background: var(--accent); color: var(--accent-ink); }
.thumb .b.lo { top: 4px; right: 4px; background: var(--bad); }
.empty-note { font-size: 12.5px; color: var(--muted); padding: 8px 2px; }
.selbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--surface); border-radius: 14px; padding: 10px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.selbar .btn { background: transparent; color: inherit; border-color: rgba(255,255,255,.25); }
.selbar select { background: var(--ink); color: var(--surface); border-color: rgba(255,255,255,.25); }
.detail { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 14px; align-items: start; }
.detail img { width: 100%; border-radius: 8px; display: block; }
.detail dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

/* ---------- Gestalten ---------- */
#v-design.on { display: grid; grid-template-columns: 148px minmax(0, 1fr) 330px; height: calc(100dvh - var(--top-h, var(--bar-h))); }
.strip { border-right: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 10px; display: grid; gap: 10px; align-content: start; }
.pg { border: 0; background: none; padding: 4px; border-radius: 8px; display: grid; gap: 4px; text-align: left; font-size: 12px; color: var(--muted); }
.pg svg { width: 100%; height: auto; display: block; box-shadow: 0 1px 3px rgba(0,0,0,.18); background: #fff; }
.pg[aria-current="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.pg .warnmark { color: var(--warn); }
.stage { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; min-height: 0; background: var(--desk); }
.stage-tools { display: flex; align-items: center; gap: 10px; padding: 8px 12px; flex-wrap: wrap; background: var(--surface); border-bottom: 1px solid var(--line); }
.stage-tools h2 { margin-right: auto; display: flex; gap: 10px; align-items: baseline; }
.stage-tools h2 .muted { font-family: var(--font-ui); font-size: 12px; font-weight: 400; }
.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); border: 1px solid var(--line); padding: 5px 9px; border-radius: 999px; background: var(--surface); }
.toggle[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
.canvas-wrap { min-height: 0; display: grid; place-items: center; padding: 18px; overflow: hidden; }
#editor { max-width: 100%; max-height: 100%; width: 100%; height: 100%; display: block; touch-action: pan-x pan-y pinch-zoom; user-select: none; -webkit-user-select: none; }
#editor.locked { touch-action: none; }
.canvas-wrap.zoomed { overflow: auto; place-items: start; }
#editor [data-slot] { cursor: pointer; }
#editor .cropping, #editor .cropghost { cursor: grab; }
#editor .selframe { cursor: move; }
#editor .empty { cursor: pointer; }
#editor [data-block] { cursor: move; }
#editor.dragging, #editor.dragging * { cursor: grabbing !important; }
.framebar { background: var(--surface); border-top: 1px solid var(--line); padding: 8px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; min-height: 52px; }
.framebar img { width: 36px; height: 36px; object-fit: cover; border-radius: 4px; }
.framebar .range { min-width: 160px; flex: 1; max-width: 260px; }
.framebar input[type=text] { flex: 1; min-width: 140px; }
.fb-sep { width: 1px; align-self: stretch; background: var(--line); }
.framebar .meta { display: grid; font-size: 12px; line-height: 1.3; min-width: 0; max-width: 200px; }
.framebar .meta b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel { border-left: 1px solid var(--line); background: var(--surface); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; background: none; padding: 12px 6px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab-body { overflow-y: auto; padding: 14px; display: grid; gap: 16px; align-content: start; }
.layouts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.lay { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px; display: grid; gap: 4px; font-size: 10.5px; color: var(--muted); text-align: center; line-height: 1.2; }
.lay svg { width: 100%; height: auto; display: block; }
.lay[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
.caplist { display: grid; gap: 10px; }
.autoplace { display: grid; gap: 6px; padding: 12px; border-radius: 10px; background: var(--accent-soft); }
.autoplace p { margin: 0; }
.bdlist { display: grid; gap: 6px; }
.bdrow { display: grid; grid-template-columns: 64px minmax(0, 1fr) 76px 34px; gap: 6px; align-items: center; }
.bdrow input[data-f="name"] { grid-column: 1 / -1; }
.caprow { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; align-items: center; }
.caprow img { width: 44px; height: 44px; object-fit: cover; border-radius: 4px; }
.cap-month { font-weight: 600; font-size: 12.5px; margin-top: 6px; }

/* ---------- Druck ---------- */
.print { padding: 20px 16px 60px; max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 18px; align-items: start; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.checks li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; font-size: 13px; align-items: start; }
.checks li button { all: unset; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; background: var(--ok); }
.dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.progress { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.lighttable { background: var(--desk); border-radius: 12px; padding: 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }
.lt-page { display: block; border: 0; background: none; padding: 0; min-width: 0; }
.lt-page svg { width: 100%; height: auto; display: block; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.lt-group { display: grid; gap: 6px; font-size: 12px; color: var(--muted); align-content: start; min-width: 0; }
.lt-group .lt-pages { display: grid; gap: 0; }
.lt-group.row .lt-pages { grid-template-columns: 1fr 1fr; gap: 6px; }
@media (min-width: 600px) { .lt-group.row { grid-column: span 2; } }
.specs { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
.specs dt { color: var(--muted); }
.specs dd { margin: 0; }

/* ---------- Ziehen & Hinweise ---------- */
.ghost { position: fixed; z-index: 100; width: 74px; height: 74px; border-radius: 8px; overflow: hidden; pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,.35); transform: translate(-50%, -60%) rotate(-3deg); border: 2px solid #fff; }
.ghost img { width: 100%; height: 100%; object-fit: cover; }
.ghost span { position: absolute; right: 4px; bottom: 4px; background: var(--accent); color: var(--accent-ink); font-size: 11px; border-radius: 999px; padding: 1px 6px; }
.toast { display: flex; gap: 12px; align-items: center; position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; z-index: 120; font-size: 13px; box-shadow: var(--shadow); max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.on { opacity: 1; }
.busy { position: fixed; inset: 0; z-index: 110; background: rgba(15,20,25,.45); display: grid; place-items: center; padding: 16px; }
.busy .card { width: min(420px, 100%); }

/* ---------- An der Wand ---------- */
/* Eine feste Szene, unabhängig vom Farbschema: helle, leicht strukturierte Wand mit Lichtkegel */
.wall { position: fixed; inset: 0; z-index: 200; touch-action: none; --desk: #cfd2cd; color: #2a2f33;
  background: radial-gradient(circle at 20% 30%, rgba(255,255,255,.18) 0 1px, transparent 2px) 0 0 / 7px 7px,
              radial-gradient(circle at 70% 60%, rgba(0,0,0,.035) 0 1px, transparent 2px) 0 0 / 9px 9px, #cfd2cd;
  display: grid; grid-template-rows: minmax(0, 1fr) auto auto; justify-items: center; padding: calc(28px + env(safe-area-inset-top, 0px)) 16px calc(14px + env(safe-area-inset-bottom, 0px)); overflow: hidden; }
.wall-light { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 70% at 50% 0%, rgba(255,250,240,.55), rgba(255,255,255,0) 70%), linear-gradient(to bottom, rgba(0,0,0,0) 70%, rgba(0,0,0,.08)); pointer-events: none; }
.wall-stage { position: relative; display: grid; place-items: center; min-height: 0; width: 100%; }
.wall-cal { position: relative; perspective: 2400px; transform-origin: 50% 0; cursor: pointer; }
.wall-sheet { position: relative; box-shadow: 0 14px 28px rgba(0,0,0,.22), 0 2px 4px rgba(0,0,0,.18); background: #fff; }
.wall-sheet.ghost { visibility: hidden; }
.wall-sheet svg { width: 100%; height: 100%; display: block; }
.wall-wire { position: absolute; left: 0; pointer-events: none; z-index: 3; overflow: visible; }
.wall-leaf { position: absolute; left: 0; width: 100%; transform-origin: 50% 0; transform-style: preserve-3d; z-index: 4; }
.wall-leaf .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: #fff; box-shadow: 0 10px 22px rgba(0,0,0,.2); }
.wall-leaf .face.back { transform: rotateX(180deg); }
.wall-leaf .face svg { width: 100%; height: 100%; display: block; }
.wall-leaf .paper-back { width: 100%; height: 100%; background: #f3f3f1; }

.wall-nav { position: relative; display: flex; align-items: center; gap: 18px; margin-top: 18px; }
.wall-btn { width: 46px; height: 46px; border-radius: 50%; border: 0; background: rgba(255,255,255,.85); color: #222; font-size: 26px; line-height: 1; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.wall-btn:disabled { opacity: .35; }
.wall-label { display: grid; justify-items: center; font-family: var(--font-display); min-width: 180px; text-align: center; }
.wall-label b { font-size: 1.25rem; font-weight: 600; }

.wall-close { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 14px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.8); font-size: 24px; line-height: 1; z-index: 5; color: #222; }

/* ---------- Ergänzungen aus der UX-Prüfung ---------- */
.toast.on.has-act { pointer-events: auto; }
.toast-act { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 5px 10px; font-weight: 600; white-space: nowrap; }
body[data-view="design"] .toast { bottom: calc(118px + env(safe-area-inset-bottom, 0px)); }
.card.notice { border-color: var(--warn); }
.card.cta { grid-template-columns: minmax(0, 1fr) auto; align-items: center; background: var(--accent-soft); border-color: transparent; }
.card.cta h2 { margin-bottom: 4px; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; justify-self: start; font-size: 13px; }
.checks li > span { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }

.bdquick input[type=number] { width: 70px; }

.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 150; }
.specs-box summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.specs-box[open] { display: grid; gap: 12px; }
.lt-head { display: flex !important; justify-content: space-between; align-items: start; gap: 12px; flex-wrap: wrap; }
.mobile-only { display: none; }
@media (min-width: 981px) { .framebar { min-height: 96px; align-content: center; } }
@media (max-width: 980px) {
  .wallbtn { display: none; }
  .mobile-only { display: inline-flex; }
  /* Handy: Seite bleibt oben sichtbar, Werkzeuge und Fotos scrollen darunter */
  .stage { position: sticky; top: var(--top-h, var(--bar-h)); z-index: 12; box-shadow: 0 6px 12px rgba(0,0,0,.12); }
  .stage-tools { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: 6px 10px; }
  .stage-tools h2 { font-size: 1rem; white-space: nowrap; }
  .stage-tools .row { flex-wrap: nowrap; }

  .framebar .meta { max-width: 150px; }

  .framebar .range { min-width: 150px; }
  .photos { padding-bottom: 220px; }
  .card.cta { grid-template-columns: minmax(0, 1fr); }

}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------- Schmal ---------- */
@media (max-width: 980px) {
  .project, .print { grid-template-columns: minmax(0, 1fr); }
  .project .preview { position: static; order: -1; }
  #v-design.on { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto; height: auto; }
  .strip { border-right: 0; border-bottom: 1px solid var(--line); display: flex; overflow-x: auto; overflow-y: hidden; gap: 6px; padding: 8px; }
  .pg { flex: 0 0 74px; }
  .stage { grid-template-rows: auto auto auto; }
  .canvas-wrap { padding: 14px 16px; }

}

/* ----- Lokaler Dienst: Projektwahl, Projektordner, Nur ansehen ----- */
.picker { position: fixed; inset: 0; z-index: 120; display: grid; place-items: center; padding: 16px; overflow: auto;
  background: radial-gradient(circle at 20% 10%, var(--accent-soft), transparent 55%), var(--bg); }

.picker-item { display: grid; gap: 2px; text-align: left; padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; }

.picker-foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }

    l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, month - 1, day);
}

/* ---------- Blätter, Druckseiten und Monatsansichten ----------
   Ein Blatt (Sheet) ist ein physisches Blatt Papier: Vorderseite und bei beidseitigem Druck Rückseite.
   Eine Monatsansicht ist, was beim Aufhängen zu sehen ist. Wie Rückseiten genutzt werden (doc.viewMode):
     'opened'      – aufgeklappt: oben die Rückseite des vorigen Blatts, unten die Vorderseite des Monats;
                     ein Kalendarium für beide zusammen (doc.viewCal[m]: 'lower' oder 'upper')
     'alternative' – Vorder- und Rückseite sind zwei Motive desselben Monats, jedes mit Kalendarium
     'free'        – Rückseiten sind zusätzliche Fotoseiten ohne Kalendarium
   Zusätzliche Blätter (doc.extraSheets): weiteres Motiv für einen Monat oder freies Blatt, eingefügt nach einem Blatt. */
const viewModeOf = (doc = S.doc) => doc.duplex ? (doc.viewMode || 'opened') : 'single';

    out.push(sh);

  };
  if (doc.cover || viewModeOf(doc) === 'opened') push({ id: 'cover', role: 'cover', month: null, front: 'cover' });
  for (let m = 0; m < 12; m++) push({ id: 'm' + m, role: 'month', month: m, front: 'm' + m });
  if (doc.duplex) for (const sh of out) sh.back = sh.front + '-b';
  return out;
}
// Alle Blätter einschließlich Register (dessen Umfang hängt vom Inhalt ab)
function allSheets(doc = S.doc) {
  const sh = sheetList(doc);
  if (doc.index) {
    const n = indexLayout().length;
    for (let i = 1; i <= n; i++) { const k = i === 1 ? 'index' : 'index-' + i; sh.push({ id: k, role: 'index', month: null, front: k, back: doc.duplex ? k + '-b' : undefined }); }
  }
  return sh;
}
const sideKeys = (sheets) => sheets.flatMap(s => s.back ? [s.front, s.back] : [s.front]);

function baseKeys(doc = S.doc) { return sideKeys(sheetList(doc)); }
function pageKeys(doc = S.doc) {
  const keys = sideKeys(allSheets(doc));

  return keys;
}
const isIndex = (key) => /^index(-\d+)?$/.test(key);
const indexNo = (key) => key === 'index' ? 1 : +key.split('-')[1];
const isBack = (key) => key.endsWith('-b');

// Rolle jeder Seite in ihrer Monatsansicht: month, part, cal (trägt standardmäßig das Kalendarium)
function viewMap(doc = S.doc) {
  const map = {}, sheets = sheetList(doc), mode = viewModeOf(doc);
  sheets.forEach((sh, i) => {
    if (sh.role !== 'month') map[sh.front] = { month: null, part: sh.role };
    else if (mode === 'opened') map[sh.front] = { month: sh.month, part: 'lower', cal: (doc.viewCal || {})[sh.id] !== 'upper' };
    else map[sh.front] = { month: sh.month, part: sh.extra ? 'more' : 'front', cal: true };
    if (!sh.back) return;
    const next = sheets[i + 1];
    if (mode === 'opened' && next && next.role === 'month') map[sh.back] = { month: next.month, part: 'upper', cal: (doc.viewCal || {})[next.id] === 'upper', lower: next.front };
    else if (mode === 'alternative' && sh.role === 'month') map[sh.back] = { month: sh.month, part: 'altB', cal: true };
    else map[sh.back] = { month: mode === 'free' ? sh.month : null, part: 'back' };

}
const viewOf = (key) => viewMap()[key] || { month: null, part: isIndex(key) ? 'index' : 'back' };
function pageMonth(key) { return viewOf(key).month ?? null; }
// Partnerseite in der aufgeklappten Ansicht (oben ↔ unten)
function partnerOf(key) {
  const v = viewOf(key);

}
// Bezeichnung einer Seite; pageLabel für die Oberfläche, pageLabelCal für Gedrucktes (Register)

  if (isIndex(key)) return indexNo(key) > 1 ? t('Bildregister {n}', { n: indexNo(key) }) : t('Bildregister');
  if (isBack(key) && isIndex(key.slice(0, -2))) return t('Rückseite Register');
  const v = viewOf(key), m = v.month != null ? MONTH_NAMES[lang][v.month] : '';
  switch (v.part) {
    case 'cover': return t('Titelblatt');
    case 'blank': return t('Freies Blatt');
    case 'lower': return t('{m} unten', { m });
    case 'upper': return t('{m} oben', { m });
    case 'more': return t('{m}, weiteres Motiv', { m });
    case 'altB': return t('{m}, Motiv B', { m });
    case 'front': return viewModeOf() === 'alternative' ? t('{m}, Motiv A', { m }) : m;

/* ---------- Verlauf (Rückgängig) ---------- */
const hist = { past: [], future: [], last: null };
const snap = () => JSON.stringify({ doc: S.doc, pages: S.pages, photos: S.photos, demo: S.demo });
function commit() {
  ensurePages();          // z. B. neue Registerseiten
  const now = snap();
  if (now === hist.last) return;
  if (hist.last) { hist.past.push(hist.last); if (hist.past.length > 80) hist.past.shift(); }
  hist.future = []; hist.last = now;

}
// Unter dieser Auflösung warnt die App (Wandkalender werden aus etwas Abstand betrachtet)
const DPI_WARN = 150, DPI_BAD = 100;
function restore(json) {
  const o = JSON.parse(json);
  S.doc = o.doc; S.pages = o.pages; S.demo = o.demo;
  for (const id in o.photos) if (RT.thumb[id] || o.photos[id].demo != null) S.photos[id] = o.photos[id];
  for (const id in S.photos) if (!o.photos[id]) delete S.photos[id];
  ensurePages(); ui.sel = null; ui.crop = null; ui.selBlock = null;
}
// Rückgängig sichtbar machen: zur betroffenen Seite springen und sagen, was passiert ist
function changedWhere(aJson, bJson) {
  const a = JSON.parse(aJson), b = JSON.parse(bJson);
  for (const k of pageKeys()) if (JSON.stringify(a.pages[k]) !== JSON.stringify(b.pages[k])) return { page: k };
  if (JSON.stringify(a.photos) !== JSON.stringify(b.photos)) return { photos: true };
  return { doc: true };
}
function travel(dir) {
  const from = dir < 0 ? hist.past : hist.future, to = dir < 0 ? hist.future : hist.past;
  if (!from.length) return;
  const before = hist.last; to.push(before); hist.last = from.pop();
  restore(hist.last);
  const w = changedWhere(before, hist.last), back = dir < 0;
  if (w.page && pageKeys().includes(w.page)) {
    if (ui.view !== 'design' && ui.view !== 'photos') ui.view = 'design';
    if (ui.view === 'design') ui.page = w.page;
    toast(_t(back ? 'Rückgängig gemacht: {page}' : 'Wiederholt: {page}', { page: pageLabel(w.page) }));
  } else if (w.photos) toast(_t(back ? 'Rückgängig gemacht: Fotos' : 'Wiederholt: Fotos'));
  else toast(_t(back ? 'Rückgängig gemacht: Einstellungen' : 'Wiederholt: Einstellungen'));

  const u = $('#undo'), r = $('#redo');

  if (r) r.disabled = !hist.future.length;
}

/* ---------- Speichern im Browser (IndexedDB) ---------- */
const DB = {
  db: null,
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('kalenderwerkstatt', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('blobs'); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    } catch (e) { this.db = null; }
  },
  tx(store, mode, fn) {
    if (!this.db) return Promise.resolve(null);
    return new Promise((res) => {
      try {
        const t = this.db.transaction(store, mode), st = t.objectStore(store), r = fn(st);
        t.oncomplete = () => res(r && 'result' in r ? r.result : null);
        t.onerror = t.onabort = () => res(null);
      } catch (e) { res(null); }
    });
  },
  get(store, key) { return this.tx(store, 'readonly', st => st.get(key)); },
  put(store, key, val) { return this.tx(store, 'readwrite', st => st.put(val, key)); },
  del(store, key) { return this.tx(store, 'readwrite', st => st.delete(key)); },
  keys(store) { return this.tx(store, 'readonly', st => st.getAllKeys()); },
};
let saveTimer = null;
function scheduleSave() {
  if (SVC.on) { scheduleServiceSave(); return; }      // Projektordner über den lokalen Dienst
  clearTimeout(saveTimer);
  const s = $('#saveState'); if (s) s.textContent = _t('Ungespeichert …');
  saveTimer = setTimeout(async () => {
    const ok = await DB.put('kv', 'state', snap());
    // Die letzten Schritte überdauern das Neuladen, damit Rückgängig auch danach noch geht
    await DB.put('kv', 'hist', JSON.stringify(hist.past.slice(-15)));
    try { localStorage.setItem('kw-page', ui.page); } catch (e) { /* egal */ }
    if (s) s.textContent = DB.db ? _t('Im Browser gespeichert') : _t('Speichern nicht möglich');
    return ok;
  }, 700);
}

async function exifDate(file) {

  const v = new DataView(buf);

function photoThumb(ph, u, extra = '') {
  const pages = u[ph.id];
  const lo = ph.w * ph.h < 4e6;
  return `<button class="thumb ${ui.photoSel.has(ph.id) ? 'sel' : ''} ${ui.armed === ph.id ? 'armed' : ''}" data-photo="${ph.id}" ${extra} title="${esc(ph.name)}${ph.caption ? ' – ' + esc(ph.caption) : ''}">
    <img src="${RT.thumb[ph.id] || ''}" alt="" loading="lazy">
    ${ph.fav ? '<span class="b fav">★</span>' : ''}${ph.missing ? `<span class="b lo" title="${_t('Die Datei fehlt im Projektordner')}">${_t('fehlt')}</span>` : lo ? `<span class="b lo" title="${_t('Geringe Auflösung')}">${_t('klein')}</span>` : ''}
    ${pages ? `<span class="b use">${pages.map(pageShort).join(', ')}</span>` : ''}</button>`;
}

function renderEditor() {
  const wrap = $('#canvasWrap'), sx = wrap.scrollLeft, sy = wrap.scrollTop;
  wrap.dataset.proof = proofOn() ? proofLabel() : '';
  wrap.innerHTML = svgPage(curPage(), { mode: 'editor', showBleed: ui.showBleed, showBind: ui.showBind, showGuides: ui.showGuides, partner: ui.showPartner ? partnerOf(ui.page) : null, attrs: 'id="editor"' });
  const svg = $('#editor');
  // Ansichtszoom: unabhängig vom Bildzoom im Rahmen
  wrap.classList.toggle('zoomed', ui.viewZoom > 1);

/* ---------- Fotos auf Seiten verteilen ---------- */
function autoFill(key, used = null) {
  const p = S.pages[key]; if (!p || p.layout === 'index') return 0;
  used ||= new Set(Object.keys(usage()));
  const m = pageMonth(key);
  let cand = Object.values(S.photos).filter(ph => !used.has(ph.id) && (m == null ? true : ph.month === m));
  if (m == null) cand.sort((a, b) => b.fav - a.fav);
  const rects = slotRects(p).filter(r => { const s = slotOf(p, r.i); return !s.photo || !S.photos[s.photo]; }).sort((a, b) => b.w * b.h - a.w * a.h);
  let n = 0;
  // Bewertung: Favorit, passendes Seitenverhältnis und vor allem genug Auflösung für den Rahmen
  const score = (ph, r) => {
    const d = dpiOf(ph, placeImage(r, ph, newSlot())), want = r.w / r.h;
    return (ph.fav ? .6 : 0) - Math.abs(Math.log(ph.w / ph.h / want)) - (d < DPI_BAD ? 3 : d < DPI_WARN ? 1 : 0);
  };
  for (const r of rects) {
    if (!cand.length) break;
    cand.sort((a, b) => score(b, r) - score(a, r));
    const ph = cand.shift(); used.add(ph.id);
    Object.assign(slotOf(p, r.i), { photo: ph.id, zoom: 1, cx: .5, cy: .5, rot: 0, fit: 'cover' }); n++;
  }
  return n;
}

function ask({ title, text, buttons }) {
  return new Promise((resolve) => {
    const el = document.createElement('div'); el.className = 'busy'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
    el.innerHTML = `<div class="card"><h2>${esc(title)}</h2><p class="hint">${esc(text)}</p><div class="row">${buttons.map((b, i) => `<button class="btn ${b.primary ? 'primary' : ''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div></div>`;
    const done = (v) => { document.removeEventListener('keydown', key, true); el.remove(); resolve(v); };
    const key = (e) => { if (e.key === 'Escape') { e.stopPropagation(); done(buttons[buttons.length - 1].value); } };
    el.addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (b) done(buttons[+b.dataset.i].value); });
    document.addEventListener('keydown', key, true);
    document.body.appendChild(el);
    (el.querySelector('.btn.primary') || el.querySelector('.btn')).focus();
  });
}

    if (corner.includes('e') && vov && Math.abs(r.x - (r0.x + r0.w) - gap) < tol) out.push({ key: r.i, r: { ...r }, edge: 'e' });
    if (corner.includes('w') && vov && Math.abs(r0.x - (r.x + r.w) - gap) < tol) out.push({ key: r.i, r: { ...r }, edge: 'w' });
    if (corner.includes('s') && hov && Math.abs(r.y - (r0.y + r0.h) - gap) < tol) out.push({ key: r.i, r: { ...r }, edge: 's' });
    if (corner.includes('n') && hov && Math.abs(r0.y - (r.y + r.h) - gap) < tol) out.push({ key: r.i, r: { ...r }, edge: 'n' });

async function renderCrop(it, dpi, panels = [], rgb = false) {

  let k = Math.min(dpi / 25.4, ph.w / pl.w);

  const c = document.createElement('canvas'); c.width = ow; c.height = oh;

}

async function loadSaved() {

  if (!json) return false;
  try {
    const o = JSON.parse(json);
    S = { doc: { ...defaultDoc(), ...o.doc }, pages: o.pages || {}, photos: o.photos || {}, demo: !!o.demo };
    // Älterer Stand: „Rückseiten mit Fotos“ entspricht beidseitig mit freien Rückseiten
    if (o.doc && o.doc.backs && o.doc.duplex == null) { S.doc.duplex = true; S.doc.viewMode = 'free'; }
    delete S.doc.backs;
    // Stand aus der Zeit, als es nur Deutsch gab: Kalender bleibt deutsch
    if (o.doc && !o.doc.calLang) S.doc.calLang = 'de';
    for (const [k, p] of Object.entries(S.pages)) if (isBack(k) && p.cal && p.cal.style === 'off' && Object.keys(p.cal).length === 1) p.cal = {};
  } catch (e) { return false; }
  // Gespeicherter Verlauf: Fotos, die er noch kennt, bleiben erhalten (Rückgängig nach dem Neuladen)
  let past = []; try { past = JSON.parse(await DB.get('kv', 'hist') || '[]'); } catch (e) { past = []; }
  const keep = new Set();
  for (const sj of past) { try { const o = JSON.parse(sj); for (const [id, p] of Object.entries(o.photos || {})) { keep.add(id); if (p.copyOf) keep.add(p.copyOf); } } catch (e) { /* egal */ } }

  const ids = await DB.keys('blobs') || [];
  for (const id of ids) {
    const rec = await DB.get('blobs', id);
    if (!S.photos[id] && !keep.has(id) && !Object.values(S.photos).some(p => p.copyOf === id)) { DB.del('blobs', id); continue; }
    if (rec) { setUrls(id, rec.prev, rec.thumb); if (rec.file) RT.file[id] = rec.file; }
  }
  for (const ph of Object.values(S.photos)) if (ph.copyOf && RT.thumb[ph.copyOf]) {
    RT.prev[ph.id] = RT.prev[ph.copyOf]; RT.thumb[ph.id] = RT.thumb[ph.copyOf]; if (RT.file[ph.copyOf]) RT.file[ph.id] = RT.file[ph.copyOf];

  for (const id of Object.keys(S.photos)) if (!RT.thumb[id]) delete S.photos[id];
  return true;
}

const editorState = () => ({ v: 1, doc: S.doc, pages: S.pages });
// Bildtext, Favorit und Aussortieren je Foto; nur Abweichungen vom Stand des Dienstes (oder alles)
function photoMeta(all = false) {
  const out = {};
  for (const a of Object.values(SVC.assets)) {
    if (!usable(a)) continue;
    const ph = S.photos[a.id];
    const want = ph ? { caption: ph.caption || '', favorite: !!ph.fav, excluded: false } : { excluded: true };
    const diff = {};
    for (const k in want) if (all || want[k] !== (k === 'caption' ? a.caption || '' : !!a[k])) diff[k] = want[k];
    if (Object.keys(diff).length) out[a.id] = diff;
  }
  return out;
}
function scheduleServiceSave() {
  if (!SVC.pid) return;
  if (SVC.readOnly) {
    setSaveState(_t('Nur ansehen – nicht gespeichert'));
    if (!SVC.warnedRO) { SVC.warnedRO = true; toast(_t('Nur ansehen: Änderungen werden nicht gespeichert, solange das Projekt woanders bearbeitet wird.'), 7000); }
    return;
  }
  SVC.pending = true; setSaveState(_t('Ungespeichert …'));
  clearTimeout(SVC.timer); SVC.timer = setTimeout(() => serial(serviceSave), 800);
}
function flushSave() {
  if (!SVC.pending) return SVC.queue;
  clearTimeout(SVC.timer);
  return serial(serviceSave);
}
async function serviceSave() {
  if (!SVC.pending || SVC.readOnly || !SVC.pid) return;
  SVC.pending = false;
  try {
    const touched = await syncPhotoFiles();
    const meta = photoMeta();
    await api(PP('/save'), { method: 'POST', body: { editor: editorState(), calendarYear: S.doc.year,
      format: { id: S.doc.format, widthMm: S.doc.w, heightMm: S.doc.h, bleedMm: S.doc.bleed }, assets: meta, printerProfileId: S.doc.printer || '' } });
    for (const [id, m] of Object.entries(meta)) Object.assign(SVC.assets[id], m);
    if (SVC.offline) SVC.offline = false;
    setSaveState(SVC.pending ? _t('Ungespeichert …') : _t('Im Projektordner gespeichert'));
    if (touched && ui.view === 'photos') renderPhotos();
  } catch (e) {
    if (e.status === 423) { lockLost(); return; }
    SVC.pending = true;
    if (e instanceof TypeError) {               // Dienst nicht erreichbar: später noch einmal
      SVC.offline = true; setSaveState(_t('Dienst nicht erreichbar – wird nachgeholt'));
      clearTimeout(SVC.timer); SVC.timer = setTimeout(() => serial(serviceSave), 5000);
    } else { setSaveState(_t('Speichern fehlgeschlagen')); toast(_t('Speichern fehlgeschlagen: {error}', { error: e.message }), 8000, { label: _t('Noch einmal'), fn: () => serial(serviceSave) }); }
  }
}
// Monatswechsel und Kopien der Oberfläche als Dateioperationen nachziehen
async function syncPhotoFiles() {
  let touched = false;
  const facts = {};                             // neue Pfade, auch im aktuellen Verlaufsstand nachtragen
  for (const ph of Object.values(S.photos)) {
    const a = SVC.assets[ph.id], want = ph.month < 0 ? null : ph.month;
    if (!a) {
      // In der Oberfläche angelegte Kopie: jetzt als eigene Datei im Monatsordner anlegen
      const src = ph.copyOf && SVC.assets[ph.copyOf] ? ph.copyOf : null;
      if (!src) { delete S.photos[ph.id]; continue; }
      try {
        const c = gotAsset(await api(PP(`/assets/${src}/copy`), { method: 'POST', body: { month: want } }));
        renamePhoto(ph.id, c.id); Object.assign(S.photos[c.id], fileFacts(c)); facts[c.id] = fileFacts(c); touched = true;
      } catch (e) { if (e.status === 423) throw e; toast(_t('Kopie konnte nicht angelegt werden: {error}', { error: e.message }), 7000); }
      continue;
    }
    if ((a.month ?? null) === want || a.status === 'missing') continue;
    try {
      const m = gotAsset(await api(PP(`/assets/${ph.id}/move`), { method: 'POST', body: { month: want } }));
      Object.assign(ph, { path: m.path, name: baseName(m.path) }); facts[ph.id] = { path: m.path, name: baseName(m.path) }; touched = true;
    } catch (e) {
      if (e.status === 423) throw e;
      ph.month = a.month ?? -1;                 // Datei liegt weiter im alten Ordner
      toast(_t('„{name}“ konnte nicht verschoben werden: {error}', { name: ph.name, error: e.message }), 8000);
    }
  }
  // Nur die Dateiangaben nachtragen, nicht den ganzen Zustand: ein gerade laufendes Ziehen bleibt so ein eigener Schritt
  if (touched && hist.last) { const o = JSON.parse(hist.last); for (const [id, f] of Object.entries(facts)) if (o.photos[id]) Object.assign(o.photos[id], f); hist.last = JSON.stringify(o); }
  return touched;
}

/* ----- Abgleich mit den Monatsordnern ----- */
function serviceScan(manual) {
  if (!SVC.pid) return Promise.resolve();
  if (SVC.readOnly) { if (manual) toast(_t('Nur ansehen: Abgleichen geht erst, wenn das Projekt frei ist.')); return Promise.resolve(); }
  clearTimeout(SVC.timer);
  return serial(async () => {
    await serviceSave();
    setSaveState(_t('Ordner wird abgeglichen …'));
    SVC.lastScan = Date.now();
    try {
      const rep = await api(PP('/scan'), { method: 'POST' });
      const list = await api(PP('/assets'));
      const ids = new Set([...rep.added, ...rep.moved, ...rep.changed, ...rep.missing, ...rep.reassigned]);
      SVC.info = await api(PP());
      if (ids.size) {
        const byId = Object.fromEntries(list.map(a => [a.id, a]));
        for (const id of ids) {
          const a = byId[id]; if (!a) continue;
          gotAsset(a);
          if (a.excluded || !usable(a)) continue;
          S.photos[id] = photoFromAsset(a, S.photos[id]);
        }
        rebaseHistory(o => { for (const id of ids) { const a = byId[id]; if (!a || a.excluded || !usable(a)) continue; o.photos[id] = o.photos[id] ? { ...o.photos[id], ...fileFacts(a) } : photoFromAsset(a); } });
        renderAll();
      }
      setSaveState(_t('Im Projektordner gespeichert'));
      const parts = [];
      if (rep.added.length) parts.push(plural(rep.added.length, _t('neues Foto'), _t('neue Fotos')));
      const resorted = new Set([...rep.moved, ...rep.reassigned]).size;
      if (resorted) parts.push(_t('{n} umsortiert', { n: resorted }));
      if (rep.changed.length) parts.push(_t('{n} geändert', { n: rep.changed.length }));
      if (rep.missing.length) parts.push(_t('{n} fehlen', { n: rep.missing.length }));
      if (parts.length) toast(_t('Projektordner: {changes}.', { changes: parts.join(', ') }), 7000, rep.added.length && ui.view !== 'photos' ? { label: _t('Ansehen'), fn: () => setView('photos') } : null);
      else if (manual) toast(_t('Alles aktuell: Die Monatsordner und das Projekt stimmen überein.'));
    } catch (e) {
      if (e.status === 423) { lockLost(); return; }
      setSaveState(_t('Abgleich fehlgeschlagen')); if (manual) toast(_t('Abgleich fehlgeschlagen: {error}', { error: e.message }), 7000);
    }
  });
}

      el.classList.add('working');
      try { const s = await fn(); await openProject(s.id); finish('open'); }
      catch (e) { msg = e.message; el.classList.remove('working'); draw(); }
    };
    el.addEventListener('input', (e) => { const fm = e.target.closest('form'); if (fm && e.target.name && e.target.name !== 'password') vals[fm.dataset.form + ':' + e.target.name] = e.target.value; });
    el.addEventListener('click', (e) => {
      // Sprache hier selbst umschalten und neu zeichnen; der allgemeine Klick-Handler (data-act) soll nicht noch einmal laufen
      const lg = e.target.closest('[data-act="lang"]');
      if (lg) {
        e.stopPropagation();
        try { setLang(lg.dataset.v); } catch (err) { console.error(err); }
        draw(); const b = el.querySelector('[data-act="lang"]'); if (b) b.focus();
        return;
      }
      const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; msg = ''; draw(); return; }
      const w = e.target.closest('[data-where]'); if (w) { where = w.dataset.where; msg = ''; draw(); return; }
      const it = e.target.closest('[data-pid]'); if (it) { tryOpen(async () => ({ id: it.dataset.pid })); return; }
      if (e.target.closest('[data-browser]')) finish('browser');
      if (e.target.closest('[data-cancel]')) finish('cancel');
    });
    el.addEventListener('submit', (e) => {
      e.preventDefault();
      const fd = new FormData(e.target), kind = e.target.dataset.form, path = String(fd.get('path') || '').trim();
      // Ort: lokaler Ordner oder WebDAV-Ordner mit Zugangsdaten (die der Dienst nur auf diesem Rechner ablegt)
      const loc = where === 'dav'
        ? { url: String(fd.get('url') || '').trim(), username: String(fd.get('username') || '').trim(), password: String(fd.get('password') || '') }
        : { path };
      if (!(loc.url || loc.path)) return;
      // language: Sprache der Ordnernamen im neuen Projekt (Fotos/01 Januar oder Photos/01 January)
      if (kind === 'new') tryOpen(() => api('projects', { method: 'POST', body: { ...loc, title: String(fd.get('title') || '').trim() || _t('Familienkalender'), calendarYear: +fd.get('year') || year, language: LANG } }));
      else tryOpen(() => api('projects/open', { method: 'POST', body: loc }));
    });
    draw();
    document.body.appendChild(el);
  });
}

function askPrinter(file) {
  return new Promise((resolve) => {
    const el = document.createElement('div'); el.className = 'busy'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
    el.innerHTML = `<form class="card prn-form"><h2>${_t('Druckprofil anlegen')}</h2>
      <p class="hint">${_t('Aus {file}. Die Werte stehen im Datenblatt der Druckerei; ohne Angabe passen die Voreinstellungen meist.', { file: `<code>${esc(file.name)}</code>` })}</p>
      <div class="field"><label for="pa-name">${_t('Name')} <span class="muted">${_t('(optional)')}</span></label><input type="text" id="pa-name" name="name" placeholder="${esc(_t('z. B. Druckerei, Papier – sonst aus dem Profil'))}"></div>
      <div class="row"><div class="field" style="flex:1"><label for="pa-tac">${_t('Max. Farbauftrag %')}</label><input type="number" id="pa-tac" name="tac" min="200" max="400" step="10" value="300"></div>
      <div class="field" style="flex:1"><label for="pa-bleed">${_t('Beschnitt mm')}</label><input type="number" id="pa-bleed" name="bleed" min="0" max="10" step=".5" value="3"></div></div>
      <div class="field"><label for="pa-intent">${_t('Umrechnung')}</label><select id="pa-intent" name="intent"><option value="perceptual">${_t('Wahrnehmungsorientiert (für Fotos üblich)')}</option><option value="relative">${_t('Relativ farbmetrisch')}</option></select></div>
      <div class="row"><button class="btn primary" type="submit">${_t('Anlegen')}</button><button class="btn" type="button" data-cancel>${_t('Abbrechen')}</button></div></form>`;
    const done = (v) => { document.removeEventListener('keydown', key, true); el.remove(); resolve(v); };
    const key = (e) => { if (e.key === 'Escape') { e.stopPropagation(); done(null); } };
    el.addEventListener('click', (e) => { if (e.target.closest('[data-cancel]')) done(null); });
    el.addEventListener('submit', (e) => { e.preventDefault(); done(Object.fromEntries(new FormData(e.target))); });
    document.addEventListener('keydown', key, true);
    document.body.appendChild(el); el.querySelector('input').focus();
  });
}

/* ---------- An der Wand: den fertigen Kalender aufgehängt durchblättern ---------- */
// Eine Ansicht ist, was beim Aufhängen zu sehen ist: unten die Hauptseite, bei „aufgeklappt“ oben die Rückseite des vorigen Blatts.
function wallViews() {
  const mode = viewModeOf(), out = [];
  for (const k of pageKeys()) {
    const v = viewOf(k);
    if (mode === 'opened') {
      if (v.part === 'lower') out.push({ main: k, upper: partnerOf(k), label: `${MONTHS[v.month]} ${S.doc.year}` });
      else if (v.part === 'cover' || v.part === 'blank' || isIndex(k)) out.push({ main: k, upper: null, label: pageLabel(k) });
      continue;
    }
    if (isBack(k)) continue;                                    // Rückseiten zeigt die Ansicht bei „Zweites Motiv“ per Umschalter
    out.push({ main: k, upper: null, alt: mode === 'alternative' && v.part === 'front' ? k + '-b' : null,
      label: v.month == null ? pageLabel(k) : v.part === 'more' ? _t('{month} {year}, weiteres Motiv', { month: MONTHS[v.month], year: S.doc.year }) : `${MONTHS[v.month]} ${S.doc.year}` });
  }
  return out;
}
const wall = { el: null, i: 0, busy: false, showAlt: false };
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function pageSvg(key) { return S.pages[key] ? svgPage(S.pages[key], { mode: 'proof', showBind: true }) : ''; }

function openWall() {
  const views = wallViews(); if (!views.length) return;
  const i = views.findIndex(v => v.main === ui.page || v.upper === ui.page || v.alt === ui.page);
  wall.i = i >= 0 ? i : Math.max(0, views.findIndex(v => pageMonth(v.main) != null));
  wall.showAlt = false;
  const el = document.createElement('div'); el.className = 'wall'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', _t('Kalender an der Wand'));
  el.innerHTML = `<div class="wall-light" aria-hidden="true"></div>
    <button class="wall-close" data-wall="close" aria-label="${esc(_t('Schließen'))}">×</button>
    ${typeof proofAvailable === 'function' && proofAvailable() ? `<button class="wall-proof" data-wall="proof" aria-pressed="${!!ui.proof}" title="${esc(_t('Farben so zeigen, wie sie mit dem Druckprofil gedruckt aussehen (Softproof)'))}">${esc(_t('Druckansicht'))}</button>` : ''}
    <div class="wall-stage"><div class="wall-cal" id="wallCal"></div></div>
    <div class="wall-nav">
      <button class="wall-btn" data-wall="prev" aria-label="${esc(_t('Vorheriger Monat'))}">‹</button>
      <div class="wall-label"><b id="wallLabel"></b><span id="wallCount"></span></div>
      <button class="wall-btn" data-wall="next" aria-label="${esc(_t('Nächster Monat'))}">›</button>
    </div>
    <div class="wall-hint">${esc(matchMedia('(pointer: coarse)').matches ? _t('Wischen oder aufs Blatt tippen zum Umblättern') : _t('Aufs Blatt klicken, wischen oder Pfeiltasten zum Umblättern · Esc schließt'))}</div>`;
  document.body.appendChild(el); wall.el = el;
  document.documentElement.classList.add('wall-open');
  el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-wall]');
    if (b) { const a = b.dataset.wall; if (a === 'close') closeWall(); else if (a === 'alt') toggleAlt(); else if (a === 'proof') setProof({ proof: !ui.proof }).then(() => b.setAttribute('aria-pressed', !!ui.proof)); else flip(a === 'next' ? 1 : -1); return; }
    if (e.target.closest('.wall-cal') && !wall.swiped) flip(1);
  });
  // Wischen: nach oben oder links blättert weiter, nach unten oder rechts zurück
  let sx = 0, sy = 0;
  el.addEventListener('pointerdown', (e) => { sx = e.clientX; sy = e.clientY; wall.swiped = false; });
  el.addEventListener('pointerup', (e) => {
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 40) { wall.swiped = true; flip((Math.abs(dy) > Math.abs(dx) ? dy : dx) < 0 ? 1 : -1); setTimeout(() => wall.swiped = false, 50); }
  });
  document.addEventListener('keydown', wallKey, true);
  window.addEventListener('resize', renderWall);
  renderWall();
  if (!reduceMotion()) $('#wallCal').animate([{ transform: 'rotate(-1.4deg)' }, { transform: 'rotate(.7deg)' }, { transform: 'rotate(-.25deg)' }, { transform: 'rotate(0)' }], { duration: 1600, easing: 'ease-out' });
  el.querySelector('[data-wall="next"]').focus();
}
function closeWall() {
  if (!wall.el) return;
  wall.el.remove(); wall.el = null;
  document.documentElement.classList.remove('wall-open');
  document.removeEventListener('keydown', wallKey, true);
  window.removeEventListener('resize', renderWall);
}
function wallKey(e) {
  if (!wall.el) return;
  if (e.key === 'Escape') { e.stopPropagation(); closeWall(); }
  else if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); e.stopPropagation(); flip(1); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); e.stopPropagation(); flip(-1); }
}
// Seitengröße so, dass die Ansicht (ein oder zwei Seiten hoch) in den Bildschirm passt
function wallSize(two) {
  const W = S.doc.w, H = S.doc.h, ah = innerHeight * (innerWidth < 600 ? .66 : .74), aw = innerWidth * .9;
  const ph = Math.min(two ? ah / 2 : ah, aw * H / W);
  return { pw: ph * W / H, ph };
}
function wallParts(v) {
  const two = viewModeOf() === 'opened' && v.upper != null;
  return { two, main: wall.showAlt && v.alt ? v.alt : v.main, upper: v.upper };
}
function renderWall() {
  if (!wall.el) return;
  const views = wallViews(); wall.i = clamp(wall.i, 0, views.length - 1);
  const v = views[wall.i], { two, main, upper } = wallParts(v), { pw, ph } = wallSize(viewModeOf() === 'opened');
  const cal = $('#wallCal');
  cal.style.width = pw + 'px';
  cal.innerHTML = (two ? `<div class="wall-sheet" style="height:${ph}px">${pageSvg(upper)}</div>` : viewModeOf() === 'opened' ? `<div class="wall-sheet ghost" style="height:${ph}px"></div>` : '')
    + `<div class="wall-sheet" id="wallMain" style="height:${ph}px">${pageSvg(main)}</div>`
    + wireSvg(pw, ph, viewModeOf() === 'opened' ? ph : 0);
  $('#wallLabel').textContent = v.label + (v.alt ? ' · ' + (wall.showAlt ? _t('Motiv B') : _t('Motiv A')) : '');
  $('#wallCount').innerHTML = ` ${wall.i + 1} / ${views.length}${v.alt ? ` <button class="wall-alt" data-wall="alt">${esc(_t('Anderes Motiv'))}</button>` : ''}`;
  wall.el.querySelector('[data-wall="prev"]').disabled = wall.i === 0;
  wall.el.querySelector('[data-wall="next"]').disabled = wall.i === views.length - 1;
}
// Drahtbindung (Wire-O) über der Lochreihe; bei „aufgeklappt“ in der Mitte
function wireSvg(pw, ph, y0) {
  const B = S.doc.bind; if (B.type === 'none') return '';
  const k = pw / S.doc.w, c = bindingConf(B.type), loopH = (c.cy + c.hh / 2 + 3) * k * (y0 ? 2 : 1);
  const top = y0 ? y0 - loopH / 2 : -3 * k;
  let s = `<svg class="wall-wire" style="top:${top}px;height:${loopH}px" width="${pw}" height="${loopH}" aria-hidden="true"><defs><linearGradient id="wireg" x1="0" x2="1"><stop offset="0" stop-color="#5d646b"/><stop offset=".45" stop-color="#e9edf0"/><stop offset="1" stop-color="#6d747b"/></linearGradient></defs>`;
  for (const x of holePositions()) {
    for (const dx of [-.9, .9]) s += `<rect x="${(x + dx) * k - .55 * k}" y="${.5 * k}" width="${1.1 * k}" height="${loopH - 1 * k}" rx="${.55 * k}" fill="url(#wireg)"/>`;
  }
  return s + '</svg>';
}
function toggleAlt() {
  if (wall.busy) return;
  const main = $('#wallMain');
  wall.showAlt = !wall.showAlt;
  if (reduceMotion()) { renderWall(); return; }
  wall.busy = true;
  main.animate([{ transform: 'rotateY(0)' }, { transform: 'rotateY(90deg)' }], { duration: 260, easing: 'ease-in' }).finished.then(() => {
    renderWall(); const m2 = $('#wallMain');
    return m2.animate([{ transform: 'rotateY(-90deg)' }, { transform: 'rotateY(0)' }], { duration: 260, easing: 'ease-out' }).finished;
  }).finally(() => { wall.busy = false; });
}
// Umblättern: Das Blatt dreht sich um die Bindung nach oben.
// Aufgeklappt: Die Rückseite der bisherigen Monatsseite wird zum oberen Teil der nächsten Ansicht.
async function flip(dir) {
  const views = wallViews(), j = wall.i + dir;
  if (wall.busy) { wall.queued = dir; return; }                  // schnelle Klicks nicht verschlucken
  if (j < 0 || j >= views.length) return;
  const cur = views[wall.i], nxt = views[j], opened = viewModeOf() === 'opened';
  wall.showAlt = false;
  if (reduceMotion()) { wall.i = j; renderWall(); return; }
  wall.busy = true;
  const { pw, ph } = wallSize(opened), cal = $('#wallCal');
  const a = dir > 0 ? cur : nxt, b = dir > 0 ? nxt : cur;           // a liegt vor b
  // Das Blatt zwischen a und b: vorn die Hauptseite von a, hinten (aufgeklappt) der obere Teil von b.
  // Darunter liegen oben der obere Teil von a und unten die Hauptseite von b.
  const staticUpper = opened ? a.upper : null, leafFront = a.main, leafBack = opened ? b.upper : null;
  cal.innerHTML = (opened ? `<div class="wall-sheet${staticUpper ? '' : ' ghost'}" style="height:${ph}px">${staticUpper ? pageSvg(staticUpper) : ''}</div>` : '')
    + `<div class="wall-sheet" style="height:${ph}px">${pageSvg(b.main)}</div>`
    + wireSvg(pw, ph, opened ? ph : 0)
    + `<div class="wall-leaf" style="top:${opened ? ph : 0}px;height:${ph}px"><div class="face front">${pageSvg(leafFront)}<i class="shade"></i></div><div class="face back">${leafBack ? pageSvg(leafBack) : '<div class="paper-back"></div>'}<i class="shade"></i></div></div>`;
  const leaf = cal.querySelector('.wall-leaf'), shades = cal.querySelectorAll('.shade');
  const frames = dir > 0 ? [{ transform: 'rotateX(0deg)' }, { transform: 'rotateX(180deg)' }] : [{ transform: 'rotateX(180deg)' }, { transform: 'rotateX(0deg)' }];
  const opts = { duration: 950, easing: 'cubic-bezier(.45,.05,.25,1)' };
  const anim = [leaf.animate(frames, opts)];
  shades.forEach(sh => anim.push(sh.animate([{ opacity: 0 }, { opacity: .45 }, { opacity: 0 }], opts)));
  if (!opened) anim.push(leaf.animate(dir > 0 ? [{ opacity: 1 }, { opacity: 1, offset: .7 }, { opacity: 0 }] : [{ opacity: 0 }, { opacity: 1, offset: .3 }, { opacity: 1 }], opts));
  await Promise.all(anim.map(x => x.finished)).catch(() => {});
  wall.i = j; wall.busy = false; renderWall();
  if (wall.queued) { const q = wall.queued; wall.queued = 0; flip(q); }
}

init();
</script>
